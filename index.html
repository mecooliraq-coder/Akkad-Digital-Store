<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>أكاد | متجر بلاد الرافدين الرقمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        
        :root {
            --bg-primary: #0a0f12;
            --bg-secondary: #0f151a;
            --bg-card: rgba(20, 26, 31, 0.75);
            --text-primary: #e8e2d4;
            --text-secondary: #a0a0a0;
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #d4af37, #b8942e, #9a7a28);
            --border-light: rgba(212, 175, 55, 0.25);
            --shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        body.light-mode {
            --bg-primary: #f5f5f0;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --gold: #b8942e;
            --gold-gradient: linear-gradient(135deg, #d4af37, #b8942e);
            --border-light: rgba(184, 148, 46, 0.3);
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            min-height: 100vh; 
            overflow-x: hidden; 
            scroll-behavior: smooth;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .bg-pattern { 
            position: fixed; 
            inset: 0; 
            z-index: -2; 
            background: radial-gradient(ellipse at 20% 30%, rgba(212, 175, 55, 0.1) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 70%, rgba(26, 77, 140, 0.08) 0%, transparent 50%),
                        repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.02) 0px, rgba(212, 175, 55, 0.02) 2px, transparent 2px, transparent 15px),
                        linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%); 
            animation: slowZoom 25s ease-in-out infinite alternate; 
        }
        body.light-mode .bg-pattern {
            background: radial-gradient(ellipse at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 70%, rgba(26, 77, 140, 0.05) 0%, transparent 50%),
                        linear-gradient(145deg, #f5f5f0 0%, #ffffff 50%, #f5f5f0 100%);
        }
        
        @keyframes slowZoom { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        .gold-border-bottom { border-bottom: 2px solid var(--gold); box-shadow: 0 2px 20px rgba(212, 175, 55, 0.15); }
        
        .theme-toggle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { background: var(--gold); color: #0a0f12; transform: scale(1.05); }
        
        .btn-gold { background: var(--gold-gradient); color: #0a0f12; font-weight: 700; transition: all 0.3s ease; border: none; cursor: pointer; border-radius: 12px; }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4); }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); transition: all 0.3s ease; cursor: pointer; backdrop-filter: blur(4px); border-radius: 12px; color: var(--text-primary); }
        .btn-outline:hover { background: rgba(212, 175, 55, 0.15); border-color: var(--gold); transform: translateY(-2px); }
        
        .product-card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-light); border-radius: 1.5rem; transition: all 0.4s; overflow: hidden; position: relative; box-shadow: var(--shadow); }
        .product-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        
        .media-box { height: 200px; position: relative; overflow: hidden; cursor: pointer; background: linear-gradient(145deg, #0f1419, #0a0f12); border-radius: 1.5rem 1.5rem 0 0; }
        .media-box img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.6s; padding: 10px; }
        .product-card:hover .media-box img { transform: scale(1.08); }
        
        .video-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: all 0.3s ease; backdrop-filter: blur(3px); border-radius: 1.5rem; cursor: pointer; }
        .media-box:hover .video-overlay { opacity: 1; }
        .video-badge { position: absolute; top: 12px; left: 12px; background: var(--gold-gradient); color: #0a0f12; font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; z-index: 10; }
        
        .rating { display: flex; align-items: center; gap: 4px; margin: 8px 0; direction: ltr; justify-content: flex-end; }
        .star { cursor: pointer; font-size: 14px; color: #555; transition: all 0.2s ease; }
        .star.active { color: var(--gold); }
        .star:hover { transform: scale(1.1); }
        
        .categories-wrapper { position: relative; margin-top: 1rem; display: flex; align-items: center; gap: 12px; }
        .scroll-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(212, 175, 55, 0.12); border: 1px solid var(--border-light); color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; flex-shrink: 0; }
        .scroll-btn:hover { background: var(--gold); color: #0a0f12; transform: scale(1.08); }
        .categories-scroll { flex: 1; overflow-x: auto; white-space: nowrap; display: flex; gap: 12px; padding-bottom: 10px; scrollbar-width: thin; }
        .cat-btn { background: rgba(255,255,255,0.04); border: 1px solid var(--border-light); padding: 8px 22px; border-radius: 40px; font-size: 13px; font-weight: 500; transition: all 0.3s ease; cursor: pointer; white-space: nowrap; color: var(--text-primary); }
        .cat-btn.active { background: var(--gold-gradient); color: #0a0f12; border-color: var(--gold); }
        .cat-btn:hover:not(.active) { background: rgba(212, 175, 55, 0.12); border-color: var(--gold); transform: translateY(-2px); }
        
        .marquee-section { background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.06), transparent); border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); padding: 20px 0; overflow: hidden; margin: 20px 0 30px; border-radius: 50px; }
        .marquee-track { display: flex; gap: 30px; width: max-content; animation: scrollMarqueeReverse 40s linear infinite; }
        .marquee-section:hover .marquee-track { animation-play-state: paused; }
        @keyframes scrollMarqueeReverse { from { transform: translateX(-50%); } to { transform: translateX(0); } }
        .marquee-item { width: 280px; background: rgba(255,255,255,0.05); backdrop-filter: blur(8px); border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.3s ease; border: 1px solid var(--border-light); }
        .marquee-item:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); transform: translateY(-5px); }
        .marquee-item img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .marquee-item .name { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .marquee-item .price { font-size: 13px; color: var(--gold); font-weight: bold; }
        
        .products-counter { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--border-light); border-radius: 40px; padding: 6px 16px; font-size: 13px; color: var(--gold); display: inline-block; }
        
        .scroll-top-btn { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%; background: var(--gold-gradient); color: #0a0f12; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; z-index: 999; opacity: 0; visibility: hidden; }
        .scroll-top-btn.visible { opacity: 1; visibility: visible; }
        .scroll-top-btn:hover { transform: scale(1.1); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(10, 15, 18, 0.98); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-content { background: linear-gradient(145deg, #141a1f, #0f1419); border-radius: 1.5rem; padding: 1.75rem; max-width: 500px; width: 90%; border: 1px solid var(--gold); max-height: 85vh; overflow-y: auto; }
        body.light-mode .modal-content { background: linear-gradient(145deg, #ffffff, #f0f0f0); color: #1a1a1a; }
        .detail-spec { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; margin-top: 12px; }
        .spec-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .spec-label { color: var(--gold); font-weight: 500; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1a1f24; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 5px; }
        
        .toast { position: fixed; bottom: 20px; left: 20px; background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 12px 20px; border-radius: 10px; z-index: 9999; animation: slideIn 0.3s ease; }
        .toast.error { background: linear-gradient(135deg, #dc2626, #991b1b); }
        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .price-tag { font-size: 1.25rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .footer { border-top: 1px solid var(--border-light); margin-top: 40px; padding: 30px 20px; text-align: center; background: var(--bg-card); backdrop-filter: blur(10px); }
        .social-icon { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.05); display: inline-flex; align-items: center; justify-content: center; margin: 0 8px; transition: all 0.3s ease; color: var(--text-primary); text-decoration: none; overflow: hidden; }
        .social-icon img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }
        .social-icon:hover { background: var(--gold); color: #0a0f12; transform: translateY(-3px); }
        
        .store-logo { width: 55px; height: 55px; object-fit: contain; border-radius: 12px; }
        @media (max-width: 768px) { .scroll-btn { width: 32px; height: 32px; } .cat-btn { padding: 6px 14px; font-size: 11px; } .marquee-item { width: 240px; } .scroll-top-btn { width: 45px; height: 45px; } .media-box { height: 160px; } .social-icon { width: 45px; height: 45px; } .store-logo { width: 45px; height: 45px; } }
        
        .loader { width: 45px; height: 45px; border: 3px solid rgba(212, 175, 55, 0.2); border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <!-- الهيدر -->
    <nav class="sticky top-0 z-50 bg-[var(--bg-primary)]/95 backdrop-blur-lg gold-border-bottom">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload();">
                    <img id="storeLogo" src="" alt="شعار المتجر" class="store-logo rounded-full border-2 border-[#d4af37] object-cover shadow-lg">
                    <div>
                        <div class="text-2xl font-black text-[#d4af37] tracking-wide">أَكَّد</div>
                        <div class="text-[10px] text-white/40 tracking-wider">AKKAD DIGITAL STORE</div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <div class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </div>
                    <button onclick="shareStore()" class="w-10 h-10 rounded-lg bg-white/10 hover:bg-white/20 transition"><i class="fas fa-share-alt"></i></button>
                </div>
            </div>
            
            <!-- البحث -->
            <div class="relative mt-4">
                <input type="text" id="searchInput" onkeyup="searchProducts()" class="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 pr-12 text-white placeholder:text-white/30 outline-none focus:border-[#d4af37] transition" placeholder="🔍 ابحث عن منتج...">
                <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-white/30"></i>
            </div>
            
            <!-- التصنيفات -->
            <div class="categories-wrapper">
                <button class="scroll-btn" onclick="scrollCategories('left')"><i class="fas fa-chevron-right"></i></button>
                <div id="categoriesContainer" class="categories-scroll"></div>
                <button class="scroll-btn" onclick="scrollCategories('right')"><i class="fas fa-chevron-left"></i></button>
            </div>
        </div>
    </nav>
    
    <main class="container mx-auto px-4 py-6">
        <!-- أبرز المنتجات -->
        <div id="marqueeSection" class="marquee-section hidden">
            <div class="flex justify-between items-center mb-4 px-2">
                <h3 class="text-base font-bold text-[#d4af37]"><i class="fas fa-star-of-life ml-1"></i> أبرز المنتجات</h3>
                <span class="text-[11px] text-white/30">اسحب للمزيد ←</span>
            </div>
            <div class="marquee-track" id="marqueeTrack"></div>
        </div>
        
        <!-- عداد المنتجات -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
            <div class="products-counter"><i class="fas fa-box-open ml-1"></i> عدد المنتجات: <span id="productCount">0</span></div>
        </div>
        
        <!-- شاشة التحميل -->
        <div id="skeletonLoading" class="grid grid-cols-2 md:grid-cols-4 gap-5">
            <div class="bg-[#1a1f24] h-72 rounded-xl animate-pulse"></div>
            <div class="bg-[#1a1f24] h-72 rounded-xl animate-pulse"></div>
            <div class="bg-[#1a1f24] h-72 rounded-xl animate-pulse"></div>
            <div class="bg-[#1a1f24] h-72 rounded-xl animate-pulse"></div>
        </div>
        
        <!-- شبكة المنتجات -->
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 hidden"></div>
        
        <!-- لا توجد نتائج -->
        <div id="noResults" class="hidden text-center py-20">
            <i class="fas fa-search text-5xl text-white/20 mb-4"></i>
            <p class="text-white/40">لا توجد منتجات مطابقة للبحث</p>
        </div>
    </main>
    
    <!-- التذييل -->
    <div class="footer">
        <div class="container mx-auto">
            <div class="flex justify-center gap-3 mb-4 flex-wrap" id="socialLinksContainer"></div>
            <p class="text-white/30 text-xs">© 2025 أكاد - متجر بلاد الرافدين الرقمي</p>
            <p class="text-white/20 text-[10px] mt-2">Akkad Digital Store - Iraq</p>
        </div>
    </div>
    
    <!-- زر العودة للأعلى -->
    <button onclick="scrollToTop()" id="scrollTopBtn" class="scroll-top-btn"><i class="fas fa-arrow-up"></i></button>
    
    <!-- نافذة التفاصيل -->
    <div id="detailsModal" class="modal" onclick="closeModal('detailsModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-xl font-bold text-[#d4af37]"></h2>
                <button onclick="closeModal('detailsModal')" class="text-white/50 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="modalDesc" class="text-sm leading-relaxed mb-4 whitespace-pre-line max-h-[50vh] overflow-y-auto"></div>
            <div id="modalSpecs" class="detail-spec"></div>
            <button onclick="closeModal('detailsModal')" class="w-full btn-outline py-2 rounded-lg text-sm mt-4">إغلاق</button>
        </div>
    </div>
    
    <!-- نافذة الطلب -->
    <div id="orderModal" class="modal" onclick="closeModal('orderModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-[#d4af37]"><i class="fab fa-whatsapp ml-2"></i>طلب سريع</h3>
                <button onclick="closeModal('orderModal')" class="text-white/50 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="orderProductInfo" class="bg-white/5 p-3 rounded-lg text-sm mb-4"></div>
            <form id="orderForm" class="space-y-3">
                <input type="text" id="custName" placeholder="الاسم الكامل *" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white outline-none" required>
                <select id="custGov" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white outline-none" required>
                    <option value="">المحافظة *</option>
                    <option>بغداد</option><option>البصرة</option><option>نينوى</option><option>أربيل</option><option>السليمانية</option><option>دهوك</option>
                    <option>كركوك</option><option>صلاح الدين</option><option>ديالى</option><option>الأنبار</option><option>بابل</option><option>الكوت</option>
                    <option>المثنى</option><option>ذي قار</option><option>القادسية</option><option>ميسان</option><option>النجف</option><option>كربلاء</option>
                </select>
                <input type="text" id="custCity" placeholder="المنطقة *" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white outline-none" required>
                <input type="text" id="custLandmark" placeholder="أقرب نقطة دالة" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white outline-none">
                <input type="tel" id="custPhone" placeholder="رقم الموبايل *" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white outline-none" required>
                <button type="submit" class="btn-gold w-full py-3 rounded-xl font-bold"><i class="fab fa-whatsapp ml-2"></i>إرسال الطلب</button>
                <button type="button" onclick="closeModal('orderModal')" class="w-full py-2 text-xs text-white/40">إلغاء</button>
            </form>
        </div>
    </div>
    
    <!-- نافذة الفيديو -->
    <div id="videoModal" class="modal" onclick="closeVideo()">
        <div class="relative w-[90%] max-w-3xl aspect-video bg-black rounded-xl overflow-hidden border border-[#d4af37]/30">
            <button onclick="closeVideo()" class="absolute -top-10 left-0 text-white/70 hover:text-white text-2xl">&times;</button>
            <iframe id="videoFrame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAEH25yJ-pwfgFUMjLZNgDyNqw8Rcv9S6E",
            authDomain: "akkad-store-ab5a1.firebaseapp.com",
            databaseURL: "https://akkad-store-ab5a1-default-rtdb.firebaseio.com",
            projectId: "akkad-store-ab5a1",
            storageBucket: "akkad-store-ab5a1.firebasestorage.app",
            messagingSenderId: "456810444639",
            appId: "1:456810444639:web:a706dc19781cd7738e28ea"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allProducts = [], allCategories = {}, currentCategory = 'all', currentSearch = '', selectedProduct = null;
        let ratings = JSON.parse(localStorage.getItem('akkad_ratings') || '{}');
        let settings = {};

        // ========== الوضع الليلي ==========
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            const icon = document.querySelector('#themeToggle i');
            if(document.body.classList.contains('light-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }
        
        function loadTheme() {
            if(localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                document.querySelector('#themeToggle i').classList.remove('fa-moon');
                document.querySelector('#themeToggle i').classList.add('fa-sun');
            }
        }

        // ========== دوال عامة ==========
        function showToast(msg, isError = false) { 
            let t = document.createElement('div'); 
            t.className = `toast ${isError ? 'error' : ''}`; 
            t.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} ml-2"></i>${msg}`; 
            document.body.appendChild(t); 
            setTimeout(() => t.remove(), 3000); 
        }
        
        function shareStore() { 
            if(navigator.share) navigator.share({ title: 'متجر أكاد', url: window.location.href }); 
            else { navigator.clipboard.writeText(window.location.href); showToast('✅ تم نسخ رابط المتجر'); } 
        }
        
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeVideo() { document.getElementById('videoModal').style.display = 'none'; document.getElementById('videoFrame').src = ''; }
        function escapeHtml(t) { if(!t) return ''; return String(t).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
        
        function scrollCategories(direction) { 
            let container = document.querySelector('.categories-scroll'); 
            if(container) container.scrollBy({ left: direction === 'left' ? -200 : 200, behavior: 'smooth' }); 
        }

        // ========== التقييمات ==========
        function setRating(productId, rating, event) { 
            if(event) event.stopPropagation(); 
            ratings[productId] = rating; 
            localStorage.setItem('akkad_ratings', JSON.stringify(ratings)); 
            renderProducts(); 
            showToast(`✅ تم تقييم المنتج بـ ${rating} نجوم`); 
        }
        function getRating(productId) { return ratings[productId] || 0; }
        function displayRating(productId, interactive = false) { 
            let rating = getRating(productId); 
            let stars = ''; 
            for(let i=1;i<=5;i++) stars += `<i class="fas fa-star star ${i<=rating?'active':''}" ${interactive ? `onclick="setRating('${productId}', ${i}, event)"` : ''} style="font-size:14px;"></i>`; 
            return `<div class="rating-stars" style="display:flex; gap:3px;">${stars}</div>`; 
        }

        // ========== الأقسام ==========
        function getCategoryDisplayName(catValue) {
            if(!catValue) return 'عام';
            if(typeof catValue === 'string' && catValue.includes('_')) return catValue.split('_')[1];
            return catValue;
        }
        
        function renderCategories() {
            let container = document.getElementById('categoriesContainer');
            if(!container) return;
            let sorted = Object.entries(allCategories).sort((a,b) => {
                let numA = parseInt(a[1]?.split('_')[0]) || 999;
                let numB = parseInt(b[1]?.split('_')[0]) || 999;
                return numA - numB;
            });
            container.innerHTML = `<button class="cat-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="filterByCategory('all')">🏠 الكل</button>`;
            sorted.forEach(([key, value]) => {
                let displayName = getCategoryDisplayName(value);
                container.innerHTML += `<button class="cat-btn ${currentCategory === key ? 'active' : ''}" onclick="filterByCategory('${key}')">📁 ${escapeHtml(displayName)}</button>`;
            });
        }
        
        function filterByCategory(catId) { currentCategory = catId; renderProducts(); }
        function searchProducts() { currentSearch = document.getElementById('searchInput').value.toLowerCase(); renderProducts(); }

        // ========== الإعدادات (الشعارات والتواصل) ==========
        function loadStoreSettings() {
            db.ref('settings').on('value', (snapshot) => {
                settings = snapshot.val() || {};
                
                // تحديث شعار المتجر
                if(settings.store_logo) {
                    document.getElementById('storeLogo').src = settings.store_logo;
                } else {
                    document.getElementById('storeLogo').src = 'https://dso5.raed.net:449/files/Gemini-Generated-Image-wgpl90wgpl90wgpl.png';
                }
                
                // تحديث روابط التواصل
                renderSocialLinks();
            });
        }
        
        function renderSocialLinks() {
            const container = document.getElementById('socialLinksContainer');
            if(!container) return;
            
            let html = '';
            
            if(settings.whatsapp_link) {
                html += `<a href="https://wa.me/${settings.whatsapp_link.replace(/[^0-9]/g, '')}" class="social-icon" target="_blank" title="واتساب">`;
                if(settings.whatsapp_logo) html += `<img src="${settings.whatsapp_logo}" alt="واتساب">`;
                else html += `<i class="fab fa-whatsapp fa-2x"></i>`;
                html += `</a>`;
            }
            
            if(settings.facebook_link) {
                html += `<a href="${settings.facebook_link}" class="social-icon" target="_blank" title="فيسبوك">`;
                if(settings.facebook_logo) html += `<img src="${settings.facebook_logo}" alt="فيسبوك">`;
                else html += `<i class="fab fa-facebook-f fa-2x"></i>`;
                html += `</a>`;
            }
            
            if(settings.instagram_link) {
                html += `<a href="${settings.instagram_link}" class="social-icon" target="_blank" title="انستغرام">`;
                if(settings.instagram_logo) html += `<img src="${settings.instagram_logo}" alt="انستغرام">`;
                else html += `<i class="fab fa-instagram fa-2x"></i>`;
                html += `</a>`;
            }
            
            if(settings.telegram_link) {
                html += `<a href="${settings.telegram_link}" class="social-icon" target="_blank" title="تيليجرام">`;
                if(settings.telegram_logo) html += `<img src="${settings.telegram_logo}" alt="تيليجرام">`;
                else html += `<i class="fab fa-telegram fa-2x"></i>`;
                html += `</a>`;
            }
            
            if(html === '') {
                html = `<p class="text-white/30 text-xs">تابعونا على وسائل التواصل</p>`;
            }
            
            container.innerHTML = html;
        }

        // ========== المنتجات ==========
        function loadCategories() {
            db.ref('categories').on('value', (snapshot) => {
                allCategories = snapshot.val() || {};
                renderCategories();
                renderProducts();
            });
        }
        
        function renderProducts() {
            let filtered = allProducts.filter(p => {
                if(currentCategory !== 'all' && p.categoryId !== currentCategory) return false;
                if(currentSearch && !p.name?.toLowerCase().includes(currentSearch) && !(p.desc || '').toLowerCase().includes(currentSearch)) return false;
                return true;
            });
            
            document.getElementById('productCount').innerText = filtered.length;
            let grid = document.getElementById('productsGrid');
            let skeleton = document.getElementById('skeletonLoading');
            let noResults = document.getElementById('noResults');
            
            if(filtered.length === 0) { 
                grid.classList.add('hidden'); 
                skeleton.classList.add('hidden'); 
                noResults.classList.remove('hidden'); 
                return; 
            }
            
            grid.classList.remove('hidden'); 
            skeleton.classList.add('hidden'); 
            noResults.classList.add('hidden');
            
            let html = '';
            filtered.forEach(p => {
                let catName = 'عام';
                if(p.categoryId && allCategories[p.categoryId]) catName = getCategoryDisplayName(allCategories[p.categoryId]);
                let priceFormatted = p.price ? p.price.toString() : '0';
                let hasVideo = p.videoUrl && p.videoUrl.trim() !== '';
                
                html += `
                    <div class="product-card">
                        <div class="media-box" onclick="${hasVideo ? `playVideo('${escapeHtml(p.videoUrl || '').replace(/'/g, "\\'")}')` : 'return false'}">
                            ${hasVideo ? `<div class="video-badge"><i class="fas fa-play"></i> فيديو</div><div class="video-overlay"><i class="fas fa-play-circle text-4xl text-[#d4af37]"></i></div>` : ''}
                            <img src="${escapeHtml(p.imageUrl || 'https://via.placeholder.com/400x300?text=لا+توجد+صورة')}" alt="${escapeHtml(p.name)}" onerror="this.src='https://via.placeholder.com/400x300?text=خطأ+في+الصورة'">
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-base line-clamp-2">${escapeHtml(p.name)}</h3>
                            <div class="price-tag font-bold text-lg mt-1">${priceFormatted}</div>
                            <div class="text-white/40 text-xs">${escapeHtml(catName)}</div>
                            <div class="rating mt-1">${displayRating(p.id, true)}</div>
                            <div class="flex gap-2 mt-3">
                                <button onclick="showDetails('${p.id}')" class="flex-1 btn-outline py-2 rounded-lg text-sm"><i class="fas fa-info-circle ml-1"></i>تفاصيل</button>
                                <button onclick="openOrderModal('${p.id}')" class="flex-1 btn-gold py-2 rounded-lg text-sm"><i class="fab fa-whatsapp ml-1"></i>طلب</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }
        
        function showDetails(productId) {
            let product = allProducts.find(p => p.id === productId);
            if(!product) return;
            
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalDesc').innerHTML = (product.desc || 'لا يوجد وصف').replace(/\n/g, '<br>');
            
            let specsHtml = `<div class="spec-item"><span class="spec-label">💰 السعر:</span><span>${product.price || '0'}</span></div>`;
            if(product.categoryId && allCategories[product.categoryId]) {
                specsHtml += `<div class="spec-item"><span class="spec-label">📂 القسم:</span><span>${escapeHtml(getCategoryDisplayName(allCategories[product.categoryId]))}</span></div>`;
            }
            if(product.specs) {
                for(let [k,v] of Object.entries(product.specs)) {
                    specsHtml += `<div class="spec-item"><span class="spec-label">🔹 ${escapeHtml(k)}:</span><span>${escapeHtml(v)}</span></div>`;
                }
            }
            document.getElementById('modalSpecs').innerHTML = specsHtml;
            document.getElementById('detailsModal').style.display = 'flex';
        }
        
        function playVideo(url) {
            if(!url) return;
            let videoId = '';
            let match = url.match(/^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/);
            videoId = (match && match[7] && match[7].length === 11) ? match[7] : url;
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            document.getElementById('videoModal').style.display = 'flex';
        }
        
        function openOrderModal(productId) {
            selectedProduct = allProducts.find(p => p.id === productId);
            if(!selectedProduct) return;
            document.getElementById('orderProductInfo').innerHTML = `<strong>${escapeHtml(selectedProduct.name)}</strong><br>💰 السعر: ${selectedProduct.price || '0'}`;
            document.getElementById('orderForm').reset();
            document.getElementById('orderModal').style.display = 'flex';
        }
        
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!selectedProduct) return;
            
            let address = `${document.getElementById('custCity').value}، ${document.getElementById('custGov').value}`;
            if(document.getElementById('custLandmark').value) address += ` (بجوار: ${document.getElementById('custLandmark').value})`;
            
            let order = {
                productId: selectedProduct.id,
                productName: selectedProduct.name,
                productPrice: selectedProduct.price,
                customerName: document.getElementById('custName').value,
                governorate: document.getElementById('custGov').value,
                city: document.getElementById('custCity').value,
                landmark: document.getElementById('custLandmark').value,
                phone: document.getElementById('custPhone').value,
                status: 'جديد',
                createdAt: new Date().toISOString(),
                createdAtTimestamp: Date.now()
            };
            
            try {
                await db.ref('orders').push(order);
                let whatsappNumber = settings.whatsapp_link || "9647730492020";
                let msg = `🛍️ *طلب جديد من متجر أكاد* 🛍️%0A%0A📦 *المنتج:* ${selectedProduct.name}%0A💰 *السعر:* ${selectedProduct.price}%0A👤 *الاسم:* ${order.customerName}%0A📍 *العنوان:* ${address}%0A📞 *الجوال:* ${order.phone}%0A%0A✨ *يرجى التواصل مع العميل* ✨`;
                window.open(`https://wa.me/${whatsappNumber.replace(/[^0-9]/g, '')}?text=${msg}`, '_blank');
                showToast('✅ تم إرسال الطلب');
                closeModal('orderModal');
            } catch(err) { showToast('❌ فشل الإرسال', true); }
        });
        
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        window.addEventListener('scroll', () => { 
            let btn = document.getElementById('scrollTopBtn'); 
            if(btn) btn.classList.toggle('visible', window.scrollY > 300); 
        });
        
        function loadProducts() {
            db.ref('products').on('value', (snapshot) => {
                allProducts = Object.entries(snapshot.val() || {}).map(([id,val]) => ({ id, ...val }));
                renderProducts();
                renderMarquee();
            });
        }
        
        function renderMarquee() {
            let marquee = document.getElementById('marqueeSection'), track = document.getElementById('marqueeTrack');
            let topProducts = [...allProducts].sort((a,b) => (getRating(b.id) - getRating(a.id))).slice(0, 12);
            if(topProducts.length === 0) { marquee.classList.add('hidden'); return; }
            marquee.classList.remove('hidden');
            track.innerHTML = [...topProducts, ...topProducts].map(p => `
                <div class="marquee-item" onclick="showDetails('${p.id}')">
                    <img src="${escapeHtml(p.imageUrl || 'https://via.placeholder.com/80x80')}" onerror="this.src='https://via.placeholder.com/80x80'">
                    <div class="info">
                        <div class="name">${escapeHtml(p.name)}</div>
                        <div class="price">💰 ${p.price || '0'}</div>
                    </div>
                </div>
            `).join('');
        }
        
        // ========== تشغيل التطبيق ==========
        loadTheme();
        loadStoreSettings();
        loadCategories();
        loadProducts();
    </script>
</body>
</html>
