<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>AKKAD STORE | متجر أكاد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0f12;
            color: #e8e2d4;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ========== خلفية متحركة ========== */
        .floating-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .float-product {
            position: absolute; width: 140px; height: 140px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.05; animation: floatRandom 25s ease-in-out infinite;
            filter: blur(2px); border-radius: 16px;
        }
        @keyframes floatRandom {
            0% { transform: translate(0,0) rotate(0deg); opacity: 0.03; }
            25% { transform: translate(40px,-60px) rotate(8deg); opacity: 0.08; }
            50% { transform: translate(-30px,-100px) rotate(-5deg); opacity: 0.12; }
            75% { transform: translate(50px,-40px) rotate(5deg); opacity: 0.08; }
            100% { transform: translate(0,0) rotate(0deg); opacity: 0.03; }
        }

        /* ========== الحروف المسمارية ========== */
        .cuneiform {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            font-size: clamp(80px,20vw,250px); font-weight: bold;
            color: #d4af37; opacity: 0.03; white-space: nowrap;
            animation: slideCuneiform 30s linear infinite;
        }
        @keyframes slideCuneiform {
            0% { transform: translateX(100%) rotate(0deg); }
            100% { transform: translateX(-100%) rotate(5deg); }
        }

        /* ========== رأس الصفحة ========== */
        .header-main {
            position: relative; z-index: 10;
            background: rgba(10,15,18,0.7); backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(212,175,55,0.3); padding: 15px 20px;
        }
        .header-flex { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .header-right { flex: 1; display: flex; justify-content: flex-start; }
        .header-social { display: flex; gap: 12px; flex-wrap: wrap; }
        .header-social a {
            width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
            color: #d4af37; text-decoration: none; font-size: 1.2rem;
        }
        .header-social a:hover { background: #d4af37; color: #0a0f12; transform: translateY(-3px); }
        .header-center { text-align: center; flex-shrink: 0; }
        .logo-medium {
            width: 65px; height: 65px; object-fit: contain; border-radius: 50%;
            border: 2px solid #d4af37; background: #0a0f12; padding: 6px; margin-bottom: 5px;
        }
        .store-title { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg,#d4af37,#f0c674); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 2px; }
        .store-subtitle { font-size: 0.6rem; color: #d4af37; letter-spacing: 3px; }
        .header-left { flex: 1; display: flex; justify-content: flex-end; gap: 12px; align-items: center; flex-wrap: wrap; }
        .search-box {
            display: flex; align-items: center; background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212,175,55,0.3); border-radius: 40px; padding: 5px 15px; gap: 8px;
        }
        .search-box input { background: transparent; border: none; color: #e8e2d4; padding: 8px 0; font-size: 14px; width: 180px; outline: none; }
        .search-box input::placeholder { color: #888; }
        .search-box button { background: transparent; border: none; color: #d4af37; cursor: pointer; font-size: 1.1rem; }
        .top-btn {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.5); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; color: #d4af37; font-size: 1.1rem; position: relative;
        }
        .top-btn:hover { background: #d4af37; color: #0a0f12; transform: scale(1.05); }

        /* ========== [تحسين 1] زر السلة مع Badge ========== */
        .cart-badge {
            position: absolute; top: -6px; right: -6px;
            background: #e53e3e; color: white; font-size: 10px; font-weight: bold;
            width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 2px solid #0a0f12; opacity: 0; transition: opacity 0.3s;
        }
        .cart-badge.visible { opacity: 1; }

        /* ========== شريط الأقسام ========== */
        .categories-wrapper { position: relative; z-index: 10; background: rgba(10,15,18,0.5); backdrop-filter: blur(8px); padding: 12px 0; }
        .categories-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 5px 20px; scrollbar-width: thin; scroll-snap-type: x mandatory; }
        .categories-scroll::-webkit-scrollbar { height: 4px; }
        .categories-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .categories-scroll::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
        .cat-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3); padding: 8px 24px;
            border-radius: 60px; font-size: 14px; font-weight: 600; transition: all 0.3s ease;
            cursor: pointer; white-space: nowrap; color: #e8e2d4; scroll-snap-align: start;
            display: flex; align-items: center; gap: 8px;
        }
        .cat-btn.active { background: linear-gradient(135deg,#d4af37,#b8942e); color: #0a0f12; border-color: #d4af37; }
        .cat-count { background: rgba(0,0,0,0.3); border-radius: 30px; padding: 2px 8px; font-size: 11px; font-weight: bold; }

        /* ========== شريط المنتجات المتحرك ========== */
        .marquee-section {
            position: relative; z-index: 10;
            background: linear-gradient(90deg,transparent,rgba(212,175,55,0.1),transparent);
            border-top: 1px solid rgba(212,175,55,0.2); border-bottom: 1px solid rgba(212,175,55,0.2);
            padding: 12px 0; overflow: hidden; margin: 10px 0;
        }
        .marquee-track { display: flex; gap: 20px; width: max-content; animation: scrollMarquee var(--marquee-speed,25s) linear infinite; }
        .marquee-section:hover .marquee-track { animation-play-state: paused; }
        @keyframes scrollMarquee { from { transform: translateX(-50%); } to { transform: translateX(0); } }
        .marquee-item {
            width: 230px; background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); border-radius: 14px;
            padding: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer;
            transition: all 0.3s ease; border: 1px solid rgba(212,175,55,0.2);
        }
        .marquee-item:hover { border-color: #d4af37; background: rgba(212,175,55,0.15); transform: translateY(-3px); }
        .marquee-item img { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; }
        .marquee-item .marquee-name { font-weight: bold; font-size: 13px; }
        .marquee-item .marquee-price { color: #d4af37; font-size: 12px; font-weight: bold; }

        /* ========== المنتجات ========== */
        .products-container { position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 25px; }
        .product-card {
            background: rgba(20,26,31,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(212,175,55,0.2);
            border-radius: 20px; transition: all 0.4s ease; overflow: hidden; cursor: pointer;
        }
        .product-card:hover { transform: translateY(-8px); border-color: #d4af37; box-shadow: 0 20px 35px rgba(0,0,0,0.4); }
        .product-image-wrapper { position: relative; overflow: hidden; background: #0a0f12; }
        .product-img { width: 100%; height: 180px; object-fit: contain; padding: 12px; transition: transform 0.4s ease; }
        .product-card:hover .product-img { transform: scale(1.05); }
        .video-overlay-bg { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; z-index: 5; }
        .product-image-wrapper:hover .video-overlay-bg { opacity: 1; }
        .play-icon-large { width: 60px; height: 60px; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; cursor: pointer; }
        .play-icon-large i { font-size: 1.8rem; color: #d4af37; margin-right: 4px; }
        .play-icon-large:hover { background: #d4af37; transform: scale(1.1); }
        .play-icon-large:hover i { color: #0a0f12; }
        .video-badge { position: absolute; top: 10px; left: 10px; background: linear-gradient(135deg,#d4af37,#b8942e); color: #0a0f12; font-size: 11px; font-weight: bold; padding: 4px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; z-index: 10; }

        /* ========== [تحسين 2] أزرار الكارد المحسّنة ========== */
        .card-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .btn-order-main {
            background: linear-gradient(135deg, #25D366, #1da851);
            color: white; padding: 12px 16px; border-radius: 14px; font-weight: 700;
            font-size: 15px; transition: all 0.3s; cursor: pointer; width: 100%;
            text-align: center; border: none; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(37,211,102,0.3);
        }
        .btn-order-main:hover { background: linear-gradient(135deg, #1da851, #128C7E); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,211,102,0.4); }
        .btn-secondary-row { display: flex; gap: 8px; }
        .btn-details {
            background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
            padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 13px;
            transition: all 0.3s; cursor: pointer; flex: 1; text-align: center; color: #e8e2d4;
        }
        .btn-details:hover { background: rgba(212,175,55,0.25); border-color: #d4af37; }
        .btn-add-cart {
            background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
            padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 13px;
            transition: all 0.3s; cursor: pointer; flex: 1; text-align: center; color: #d4af37;
        }
        .btn-add-cart:hover { background: #d4af37; color: #0a0f12; }
        .btn-add-cart.added { background: #d4af37; color: #0a0f12; }

        /* ========== تقييم النجوم ========== */
        .rating-stars { display: flex; gap: 4px; margin: 8px 0; direction: ltr; justify-content: flex-start; align-items: center; }
        .star { color: #555; font-size: 14px; }
        .star.active { color: #d4af37; text-shadow: 0 0 2px rgba(212,175,55,0.5); }
        .rating-value { font-size: 13px; color: #d4af37; margin-right: 8px; }
        .reviews-count { font-size: 11px; color: #888; margin-right: 5px; }
        .product-price { font-size: 1.4rem; font-weight: bold; color: #d4af37; margin: 8px 0; }

        /* ========== [تحسين 3] حالة البحث الفارغة ========== */
        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 60px 20px;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }
        .empty-state-icon {
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(212,175,55,0.1); border: 2px solid rgba(212,175,55,0.3);
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(212,175,55,0); }
        }
        .empty-state h3 { font-size: 1.3rem; font-weight: 700; color: #d4af37; }
        .empty-state p { font-size: 14px; color: #888; max-width: 300px; line-height: 1.6; }
        .empty-state-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .btn-reset-search {
            background: linear-gradient(135deg,#d4af37,#b8942e); color: #0a0f12;
            padding: 10px 24px; border-radius: 30px; font-weight: 700; border: none;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-reset-search:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(212,175,55,0.3); }
        .btn-show-all {
            background: transparent; color: #d4af37;
            padding: 10px 24px; border-radius: 30px; font-weight: 700;
            border: 1px solid rgba(212,175,55,0.4); cursor: pointer; transition: all 0.3s;
        }
        .btn-show-all:hover { background: rgba(212,175,55,0.1); }

        /* ========== مودال المنتج ========== */
        .modal { display: none; position: fixed; inset: 0; background: rgba(10,15,18,0.98); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-content { background: #141a1f; border-radius: 28px; padding: 25px; max-width: 600px; width: 90%; border: 1px solid #d4af37; max-height: 85vh; overflow-y: auto; }

        /* قسم التعليقات */
        .reviews-section { margin-top: 20px; border-top: 1px solid rgba(212,175,55,0.2); padding-top: 15px; }
        .reviews-title { color: #d4af37; font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .review-item { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .review-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        .review-name { font-weight: bold; color: #d4af37; }
        .review-date { font-size: 10px; color: #888; }
        .review-stars { display: flex; gap: 3px; margin: 5px 0; direction: ltr; justify-content: flex-start; }
        .review-stars .star-sm { font-size: 12px; color: #555; }
        .review-stars .star-sm.active { color: #d4af37; }
        .review-text { font-size: 13px; line-height: 1.5; margin-top: 6px; }
        .no-reviews { color: #888; font-size: 13px; text-align: center; padding: 15px; }

        /* نموذج إضافة تقييم */
        .add-review-form { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 15px; margin-top: 15px; }
        .add-review-title { font-size: 14px; margin-bottom: 10px; color: #d4af37; }
        .rating-input { display: flex; gap: 8px; margin-bottom: 12px; direction: ltr; }
        .rating-star-btn { font-size: 24px; cursor: pointer; color: #555; transition: all 0.2s; background: none; border: none; }
        .rating-star-btn:hover, .rating-star-btn.active { color: #d4af37; transform: scale(1.1); }
        .review-input { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.08); color: #e8e2d4; font-size: 13px; resize: vertical; margin-bottom: 12px; font-family: 'Tajawal', sans-serif; }
        .btn-submit-review { background: linear-gradient(135deg,#d4af37,#b8942e); color: #0a0f12; padding: 8px 16px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; width: 100%; }

        /* ========== [تحسين 1] مودال السلة ========== */
        .cart-modal { display: none; position: fixed; inset: 0; background: rgba(10,15,18,0.98); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .cart-modal-content {
            background: #141a1f; border-radius: 28px; padding: 25px;
            max-width: 550px; width: 90%; border: 1px solid #d4af37; max-height: 85vh; overflow-y: auto;
        }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cart-title { color: #d4af37; font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .cart-item {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.05); border-radius: 14px; padding: 12px; margin-bottom: 10px;
            border: 1px solid rgba(212,175,55,0.15);
        }
        .cart-item img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 700; font-size: 14px; }
        .cart-item-price { color: #d4af37; font-size: 13px; margin-top: 4px; }
        .cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .qty-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(212,175,55,0.2); border: 1px solid rgba(212,175,55,0.4); color: #d4af37; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; transition: all 0.2s; }
        .qty-btn:hover { background: #d4af37; color: #0a0f12; }
        .qty-value { font-weight: bold; min-width: 20px; text-align: center; }
        .cart-item-remove { color: #e53e3e; cursor: pointer; padding: 8px; border-radius: 8px; transition: all 0.2s; background: rgba(229,62,62,0.1); border: none; }
        .cart-item-remove:hover { background: rgba(229,62,62,0.25); }
        .cart-empty { text-align: center; padding: 40px 20px; color: #888; }
        .cart-empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .cart-total { background: rgba(212,175,55,0.1); border-radius: 14px; padding: 15px; margin: 15px 0; border: 1px solid rgba(212,175,55,0.3); }
        .cart-total-row { display: flex; justify-content: space-between; align-items: center; }
        .cart-total-label { font-size: 14px; color: #888; }
        .cart-total-value { font-size: 1.2rem; font-weight: 800; color: #d4af37; }
        .btn-checkout {
            background: linear-gradient(135deg,#25D366,#1da851); color: white;
            padding: 14px; border-radius: 14px; font-weight: 700; font-size: 16px;
            width: 100%; border: none; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37,211,102,0.3);
        }
        .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,211,102,0.4); }
        .btn-clear-cart { background: rgba(229,62,62,0.1); color: #e53e3e; border: 1px solid rgba(229,62,62,0.3); padding: 10px; border-radius: 12px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; transition: all 0.3s; }
        .btn-clear-cart:hover { background: rgba(229,62,62,0.2); }

        /* ========== مودال الطلب ========== */
        .order-modal { display: none; position: fixed; inset: 0; background: rgba(10,15,18,0.98); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .order-modal-content { background: #141a1f; border-radius: 28px; padding: 25px; max-width: 500px; width: 90%; border: 1px solid #d4af37; max-height: 85vh; overflow-y: auto; }

        /* ========== خطوات الطلب ========== */
        .order-steps { display: flex; gap: 0; margin-bottom: 25px; }
        .order-step { flex: 1; text-align: center; position: relative; }
        .order-step:not(:last-child)::after {
            content: ''; position: absolute; top: 18px; left: -50%; width: 100%;
            height: 2px; background: rgba(212,175,55,0.2); z-index: 0;
        }
        .order-step.active:not(:last-child)::after { background: rgba(212,175,55,0.6); }
        .step-circle {
            width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; position: relative; z-index: 1;
            border: 2px solid rgba(212,175,55,0.3); background: #141a1f; color: #888; transition: all 0.3s;
        }
        .order-step.active .step-circle { border-color: #d4af37; color: #d4af37; background: rgba(212,175,55,0.1); }
        .order-step.done .step-circle { border-color: #25D366; color: #25D366; background: rgba(37,211,102,0.1); }
        .step-label { font-size: 11px; color: #888; }
        .order-step.active .step-label { color: #d4af37; }
        .step-panel { display: none; }
        .step-panel.active { display: block; }

        .order-modal-content h3 { color: #d4af37; margin-bottom: 15px; font-size: 1.4rem; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #e8e2d4; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border-radius: 12px;
            border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.08);
            color: #e8e2d4; font-size: 14px; outline: none; font-family: 'Tajawal', sans-serif; transition: border 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #d4af37; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 130px; }
        .order-summary { background: rgba(212,175,55,0.1); padding: 15px; border-radius: 14px; margin: 15px 0; border: 1px solid rgba(212,175,55,0.3); }
        .order-summary-title { color: #d4af37; font-weight: 700; margin-bottom: 10px; }
        .order-summary-item { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
        .btn-next-step {
            background: linear-gradient(135deg,#d4af37,#b8942e); color: #0a0f12;

        /* ========== [تحسين 4] إصلاح الوضع الفاتح الشامل ========== */

<body>
    <div class="floating-bg" id="floatingBg"></div>
    <div class="cuneiform" style="bottom: 10%; right: -20%;">𒀭𒈾𒀜𒈾𒀭 𒀝𒅗𒁺</div>
    <div class="cuneiform" style="top: 30%; left: -15%; animation-duration: 25s;">𒀭𒀜𒈾𒀭𒀜 𒈠𒀀𒉡</div>

    <div class="header-main">
        <div class="header-flex">
            <div class="header-right"><div class="header-social" id="headerSocial"></div></div>
            <div class="header-center">
                <img id="storeLogo" src="" alt="AKKAD" class="logo-medium mx-auto">

                <div class="store-subtitle">𒀝𒅗𒁺 𒀭𒈾𒀜𒈾</div>

            <div class="header-left">

                <div class="top-btn" onclick="shareStore()" aria-label="مشاركة المتجر"><i class="fas fa-share-alt"></i></div>
                <div class="top-btn" onclick="toggleTheme()" aria-label="تغيير المظهر"><i class="fas fa-moon"></i></div>
            </div>
        </div>
    </div>

    <div class="categories-wrapper">
        <div class="categories-scroll" id="categoriesContainer"></div>
    </div>

    <div class="marquee-section" id="marqueeSection" style="display: none;">
        <div class="marquee-track" id="marqueeTrack"></div>
    </div>

    <div class="products-container">
        <div class="products-grid" id="productsContainer"></div>
        <div id="loadingProducts" class="loader" style="display: flex;"></div>
    </div>

    <div class="footer">
        <div class="footer-social" id="footerSocial"></div>
        <div class="copyright"><i class="far fa-copyright"></i> 2024 متجر أكاد - AKKAD STORE<br><span style="font-size: 0.7rem;">جميع الحقوق محفوظة</span></div>
    </div>

    <!-- مودال تفاصيل المنتج -->
    <div id="productModal" class="modal" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-xl font-bold text-[#d4af37]"></h3>
                <button onclick="closeModal()" class="text-2xl hover:text-[#d4af37]" aria-label="إغلاق">&times;</button>
            </div>
            <img id="modalImg" src="" class="w-full rounded-xl mb-4" style="max-height: 200px; object-fit: contain;">
            <p id="modalDesc" class="text-sm mb-3"></p>
            <div id="modalSpecs" class="bg-white/5 rounded-xl p-3 mb-4"></div>
            <div class="reviews-section">
                <div class="reviews-title"><i class="fas fa-star"></i> تقييمات المنتج</div>
                <div id="reviewsContainer" class="reviews-list"></div>
                <div class="add-review-form">
                    <div class="add-review-title"><i class="fas fa-edit"></i> أضف تقييمك</div>
                    <div class="rating-input" id="ratingInput">
                        <span class="rating-star-btn" data-rating="1">☆</span>
                        <span class="rating-star-btn" data-rating="2">☆</span>
                        <span class="rating-star-btn" data-rating="3">☆</span>
                        <span class="rating-star-btn" data-rating="4">☆</span>
                        <span class="rating-star-btn" data-rating="5">☆</span>
                    </div>
                    <input type="text" id="reviewerName" class="review-input" placeholder="اسمك (سيظهر مع التقييم)">
                    <textarea id="reviewText" class="review-input" rows="3" placeholder="اكتب رأيك عن المنتج..."></textarea>
                    <button onclick="submitReview()" class="btn-submit-review"><i class="fas fa-paper-plane ml-2"></i> إرسال التقييم</button>
                </div>
            </div>
            <div class="flex gap-3 mt-4">
                <button onclick="closeModal(); openOrderModal(currentProduct)" class="flex-1 btn-order-main"><i class="fab fa-whatsapp"></i> طلب الآن</button>
                <button onclick="addToCartFromModal()" class="flex-1 btn-add-cart"><i class="fas fa-basket-shopping ml-1"></i> أضف للسلة</button>
            </div>
        </div>
    </div>

    <!-- مودال الفيديو -->
    <div id="videoModal" class="modal" onclick="if(event.target===this) closeVideoModal()">
        <div class="bg-black rounded-2xl overflow-hidden max-w-3xl w-full mx-4 border border-[#d4af37]">
            <div class="flex justify-end p-2"><button onclick="closeVideoModal()" class="text-white text-2xl hover:text-[#d4af37]">&times;</button></div>
            <iframe id="videoIframe" class="w-full aspect-video" src="" allowfullscreen></iframe>
        </div>
    </div>

    <!-- ========== [تحسين 1] مودال السلة ========== -->
    <div id="cartModal" class="cart-modal" onclick="if(event.target===this) closeCartModal()">
        <div class="cart-modal-content">
            <div class="cart-header">
                <div class="cart-title"><i class="fas fa-basket-shopping"></i> سلة التسوق</div>
                <button onclick="closeCartModal()" class="text-2xl hover:text-[#d4af37]" aria-label="إغلاق">&times;</button>
            </div>
            <div id="cartItemsContainer"></div>
            <div id="cartFooter"></div>
        </div>
    </div>

    <!-- ========== [تحسين 2] مودال الطلب بخطوتين ========== -->
    <div id="orderModal" class="order-modal" onclick="if(event.target===this) closeOrderModal()">
        <div class="order-modal-content">
            <h3><i class="fas fa-shopping-cart ml-2"></i> إتمام الطلب</h3>

            <!-- مؤشر الخطوات -->
            <div class="order-steps">
                <div class="order-step active" id="step-indicator-1">
                    <div class="step-circle">1</div>
                    <div class="step-label">معلوماتك</div>
                </div>
                <div class="order-step" id="step-indicator-2">
                    <div class="step-circle">2</div>
                    <div class="step-label">تأكيد الطلب</div>
                </div>
            </div>

            <!-- الخطوة 1: بيانات العميل -->
            <div class="step-panel active" id="step-panel-1">
                <div class="form-group">
                    <label><i class="fas fa-user ml-1"></i> اسم الزبون الكامل *</label>
                    <input type="text" id="customerName" placeholder="مثال: أحمد محمد علي">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-city ml-1"></i> المحافظة *</label>
                        <select id="customerCity">
                            <option value="">اختر المحافظة</option>
                            <option>بغداد</option><option>البصرة</option><option>نينوى (الموصل)</option>
                            <option>أربيل</option><option>السليمانية</option><option>دهوك</option>
                            <option>كركوك</option><option>صلاح الدين (تكريت)</option><option>ديالى (بعقوبة)</option>
                            <option>واسط (الكوت)</option><option>ميسان (العمارة)</option><option>ذي قار (الناصرية)</option>
                            <option>القادسية (الديوانية)</option><option>بابل (الحلة)</option>
                            <option>كربلاء المقدسة</option><option>النجف الأشرف</option><option>الأنبار (الرمادي)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt ml-1"></i> القضاء / المدينة *</label>
                        <input type="text" id="customerDistrict" placeholder="مثال: مركز المدينة...">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-location-dot ml-1"></i> أقرب نقطة دالة</label>
                    <input type="text" id="customerLandmark" placeholder="مثال: قرب جامع الكبير...">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone ml-1"></i> رقم الموبايل *</label>
                    <input type="tel" id="customerPhone" placeholder="مثال: 07712345678">
                </div>
                <button class="btn-next-step" onclick="goToStep2()">
                    التالي: مراجعة الطلب <i class="fas fa-arrow-left mr-2"></i>
                </button>
                <button class="btn-cancel-order" onclick="closeOrderModal()">إلغاء</button>
            </div>

            <!-- الخطوة 2: تأكيد الطلب -->
            <div class="step-panel" id="step-panel-2">
                <div class="order-summary" id="orderSummaryFull"></div>
                <button class="btn-submit-order" onclick="submitOrder()">
                    <i class="fab fa-whatsapp"></i> تأكيد وإرسال عبر واتساب
                </button>
                <button class="btn-prev-step" onclick="goToStep1()"><i class="fas fa-arrow-right ml-2"></i> رجوع للتعديل</button>
                <button class="btn-cancel-order" onclick="closeOrderModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAEH25yJ-pwfgFUMjLZNgDyNqw8Rcv9S6E",
            authDomain: "akkad-store-ab5a1.firebaseapp.com",
            databaseURL: "https://akkad-store-ab5a1-default-rtdb.firebaseio.com",
            projectId: "akkad-store-ab5a1",
            storageBucket: "akkad-store-ab5a1.firebasestorage.app",
            messagingSenderId: "456810444639",
            appId: "1:456810444639:web:a706dc19781cd7738e28ea"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let categories = [], products = [], reviews = [], settings = {}, social = {};
        let currentCategory = 'all', currentProduct = null, searchQuery = '', selectedRating = 0;

        // ========== [تحسين 1] إدارة السلة ==========
        let cart = JSON.parse(localStorage.getItem('akkad_cart') || '[]');

        function saveCart() {
            localStorage.setItem('akkad_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const total = cart.reduce((s, i) => s + i.qty, 0);
            const badge = document.getElementById('cartBadge');
            badge.textContent = total;
            badge.classList.toggle('visible', total > 0);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            const existing = cart.find(i => i.id === productId);
            if (existing) { existing.qty++; }
            else { cart.push({ id: product.id, name: product.name, price: product.price, image: product.image, qty: 1 }); }
            saveCart();
            showToast(`✅ أُضيف "${product.name}" للسلة`);
        }

        function addToCartFromModal() {
            if (!currentProduct) return;
            addToCart(currentProduct.id);
        }

        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            saveCart();
            renderCartModal();
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.qty = Math.max(1, item.qty + delta);
            saveCart();
            renderCartModal();
        }

        function openCartModal() {
            renderCartModal();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }

        function renderCartModal() {
            const container = document.getElementById('cartItemsContainer');
            const footer = document.getElementById('cartFooter');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <div class="cart-empty-icon">🛒</div>
                        <p style="color:#888; font-size:15px;">سلتك فارغة<br><span style="font-size:13px;">أضف منتجات للبدء بالتسوق</span></p>
                    </div>`;
                footer.innerHTML = '';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${escapeHtml(item.image || 'https://placehold.co/60x60')}" onerror="this.src='https://placehold.co/60x60'">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${escapeHtml(item.name)}</div>
                        <div class="cart-item-price">${escapeHtml(item.price || 'اتصل بنا')}</div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
                            <span class="qty-value">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                        </div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart('${item.id}')" aria-label="حذف"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');

            footer.innerHTML = `
                <div class="cart-total">
                    <div class="cart-total-row">
                        <span class="cart-total-label">عدد المنتجات:</span>
                        <span class="cart-total-value">${cart.reduce((s,i)=>s+i.qty,0)} قطعة</span>
                    </div>
                </div>
                <button class="btn-checkout" onclick="checkoutCart()">
                    <i class="fab fa-whatsapp"></i> طلب الكل عبر واتساب
                </button>
                <button class="btn-clear-cart" onclick="clearCart()"><i class="fas fa-trash ml-2"></i> تفريغ السلة</button>
            `;
        }

        function clearCart() {
            if (!confirm('هل تريد تفريغ السلة؟')) return;
            cart = []; saveCart(); renderCartModal();
        }

        function checkoutCart() {
            if (cart.length === 0) return;
            const whatsappNumber = settings.whatsappNumber || '';
            if (!whatsappNumber) { alert('رقم الواتساب غير متوفر حالياً'); return; }
            const itemsList = cart.map(i => `• ${i.name} × ${i.qty} — ${i.price || 'السعر عند التواصل'}`).join('\n');
            const msg = `🛍️ *طلب من متجر AKKAD STORE*\n\n📦 *المنتجات:*\n${itemsList}\n\n━━━━━━━━━━━━━━━━\n📅 ${new Date().toLocaleString('ar')}\n🏺 شكراً لتسوقك من متجر أكاد`;
            window.open(`https://wa.me/${whatsappNumber.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
            closeCartModal();
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(20,26,31,0.95);color:#e8e2d4;padding:12px 24px;border-radius:30px;border:1px solid #d4af37;font-size:14px;z-index:9999;font-family:'Tajawal',sans-serif;box-shadow:0 8px 20px rgba(0,0,0,0.4);transition:opacity 0.3s`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        // ========== تحميل البيانات ==========
        async function loadData() {
            await Promise.all([loadCategories(), loadProducts(), loadReviews(), loadSettings(), loadSocial()]);
            document.getElementById('loadingProducts').style.display = 'none';
            renderCategories(); renderProducts(); renderMarquee();
            generateFloatingProducts(); updateLogo(); renderSocialIcons();
            updateCartBadge();
        }

        async function loadCategories() {
            const snap = await db.ref('categories').once('value');
            const data = snap.val();
            categories = data ? Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||0)-(b.order||0)) : [];
        }
        async function loadProducts() {
            const snap = await db.ref('products').once('value');
            const data = snap.val();
            products = data ? Object.entries(data).map(([id,v])=>({id,...v})) : [];
        }
        async function loadReviews() {
            const snap = await db.ref('reviews').once('value');
            const data = snap.val();
            reviews = data ? Object.entries(data).map(([id,v])=>({id,...v})) : [];
        }
        async function loadSettings() {
            const snap = await db.ref('settings').once('value');
            settings = snap.val() || {};
            document.documentElement.style.setProperty('--marquee-speed', (settings.marqueeSpeed||25)+'s');
        }
        async function loadSocial() {
            const snap = await db.ref('social').once('value');
            social = snap.val() || {};
        }

        function updateLogo() {
            if (settings.storeLogo) document.getElementById('storeLogo').src = settings.storeLogo;
        }

        function renderSocialIcons() {
            const wp = settings.whatsappNumber;
            const links = [
                { icon:'fab fa-whatsapp', link: wp ? `https://wa.me/${wp.replace(/[^0-9]/g,'')}` : null, color:'#25D366' },
                { icon:'fab fa-facebook', link: social.facebookLink, color:'#1877F2' },
                { icon:'fab fa-instagram', link: social.instagramLink, color:'#E4405F' },
                { icon:'fab fa-telegram', link: social.telegramLink, color:'#26A5E4' }
            ].filter(s => s.link);
            const html = links.map(s=>`<a href="${s.link}" target="_blank" style="color:${s.color}" aria-label="تواصل معنا"><i class="${s.icon}"></i></a>`).join('');
            document.getElementById('headerSocial').innerHTML = html;
            document.getElementById('footerSocial').innerHTML = html;
        }

        function searchProducts() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts();
        }

        function listenToUpdates() {
            db.ref('products').on('value', snap => {
                const data = snap.val();
                products = data ? Object.entries(data).map(([id,v])=>({id,...v})) : [];
                renderProducts(); renderMarquee(); generateFloatingProducts(); renderCategories();
            });
            db.ref('categories').on('value', snap => {
                const data = snap.val();
                categories = data ? Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||0)-(b.order||0)) : [];
                renderCategories(); renderProducts();
            });
            db.ref('reviews').on('value', snap => {
                const data = snap.val();
                reviews = data ? Object.entries(data).map(([id,v])=>({id,...v})) : [];
                if (currentProduct) renderReviews(currentProduct.id);
            });
            db.ref('settings').on('value', snap => {
                settings = snap.val() || {};
                document.documentElement.style.setProperty('--marquee-speed',(settings.marqueeSpeed||25)+'s');
                updateLogo(); renderSocialIcons();
            });
            db.ref('social').on('value', snap => { social = snap.val() || {}; renderSocialIcons(); });
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            const counts = {};
            products.forEach(p => { counts[p.categoryId] = (counts[p.categoryId]||0)+1; });
            container.innerHTML = `<button class="cat-btn ${currentCategory==='all'?'active':''}" onclick="filterByCategory('all')"><i class="fas fa-th-large"></i> الكل <span class="cat-count">${products.length}</span></button>`;
            categories.forEach(cat => {
                container.innerHTML += `<button class="cat-btn ${currentCategory===cat.id?'active':''}" onclick="filterByCategory('${cat.id}')"><i class="fas fa-folder"></i> ${escapeHtml(cat.name)} <span class="cat-count">${counts[cat.id]||0}</span></button>`;
            });
        }

        function filterByCategory(catId) {
            currentCategory = catId; renderCategories(); renderProducts();
        }

        function getProductRating(productId) {
            const pr = reviews.filter(r => r.productId===productId && r.approved!==false);
            if (!pr.length) return { avg:0, count:0 };
            return { avg: pr.reduce((s,r)=>s+r.rating,0)/pr.length, count: pr.length };
        }

        // ========== [تحسين 2+3] عرض المنتجات مع أزرار محسّنة وحالة فارغة ==========
        function renderProducts() {
            const container = document.getElementById('productsContainer');
            let filtered = products;
            if (currentCategory !== 'all') filtered = filtered.filter(p => p.categoryId===currentCategory);
            if (searchQuery) filtered = filtered.filter(p => p.name?.toLowerCase().includes(searchQuery) || p.description?.toLowerCase().includes(searchQuery));

            if (filtered.length === 0) {
                const isSearchEmpty = searchQuery.length > 0;
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${isSearchEmpty ? '🔍' : '📦'}</div>
                        <h3>${isSearchEmpty ? `لا نتائج لـ "${escapeHtml(searchQuery)}"` : 'لا توجد منتجات في هذا القسم'}</h3>
                        <p>${isSearchEmpty ? 'تأكد من الكلمات التي كتبتها أو جرّب بحثاً مختلفاً' : 'لم يتم إضافة منتجات لهذا القسم بعد'}</p>
                        <div class="empty-state-actions">
                            ${isSearchEmpty ? `<button class="btn-reset-search" onclick="resetSearch()"><i class="fas fa-times ml-2"></i> مسح البحث</button>` : ''}
                            <button class="btn-show-all" onclick="filterByCategory('all')"><i class="fas fa-th-large ml-2"></i> عرض كل المنتجات</button>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = '';
            filtered.forEach(prod => {
                const hasVideo = prod.videoCode && prod.videoCode.length > 5;
                const rating = getProductRating(prod.id);
                const inCart = cart.find(i => i.id===prod.id);
                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-image-wrapper">
                            <img src="${escapeHtml(prod.image||'https://placehold.co/400x300/d4af37/1a1a2e?text=AKKAD')}" class="product-img" onerror="this.src='https://placehold.co/400x300/d4af37/1a1a2e?text=AKKAD'">
                            ${hasVideo ? `<div class="video-overlay-bg" onclick="event.stopPropagation(); openVideo('${prod.videoCode}')"><div class="play-icon-large"><i class="fas fa-play"></i></div></div><div class="video-badge"><i class="fas fa-video"></i> فيديو</div>` : ''}
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-lg">${escapeHtml(prod.name)}</h3>
                            <div class="rating-stars">
                                ${renderStarsStatic(rating.avg)}
                                <span class="rating-value">${rating.avg.toFixed(1)}</span>
                                <span class="reviews-count">(${rating.count})</span>
                            </div>
                            <div class="product-price">${escapeHtml(prod.price||'اتصل بنا')}</div>
                            <p class="text-sm opacity-70 mt-1 mb-2">${escapeHtml((prod.description||'').substring(0,70))}</p>
                            <div class="card-actions">
                                <button class="btn-order-main" onclick="event.stopPropagation(); openOrderModalWithProduct('${prod.id}')">
                                    <i class="fab fa-whatsapp"></i> اطلب الآن
                                </button>
                                <div class="btn-secondary-row">
                                    <button class="btn-details" onclick="event.stopPropagation(); showProductDetails('${prod.id}')">📋 التفاصيل</button>
                                    <button class="btn-add-cart ${inCart?'added':''}" id="cart-btn-${prod.id}" onclick="event.stopPropagation(); addToCart('${prod.id}'); this.classList.add('added'); this.innerHTML='<i class=\'fas fa-check ml-1\'></i> في السلة'">
                                        ${inCart ? '<i class="fas fa-check ml-1"></i> في السلة' : '<i class="fas fa-basket-shopping ml-1"></i> للسلة'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            renderProducts();
        }

        function renderStarsStatic(rating) {
            let s = '';
            for (let i=1; i<=5; i++) s += `<span class="star ${i<=Math.round(rating)?'active':''}">★</span>`;
            return s;
        }

        function renderReviews(productId) {
            const container = document.getElementById('reviewsContainer');
            const pr = reviews.filter(r => r.productId===productId && r.approved!==false);
            if (!pr.length) { container.innerHTML = '<div class="no-reviews">✨ لا توجد تقييمات بعد. كن أول من يقيم!</div>'; return; }
            container.innerHTML = pr.map(r => `
                <div class="review-item">
                    <div class="review-header">
                        <span class="review-name"><i class="fas fa-user-circle"></i> ${escapeHtml(r.reviewerName||'زبون')}</span>
                        <span class="review-date">${new Date(r.createdAt).toLocaleDateString('ar')}</span>
                    </div>
                    <div class="review-stars">${renderStarsStatic(r.rating)}</div>
                    <p class="review-text">${escapeHtml(r.comment)}</p>
                </div>`).join('');
        }

        async function submitReview() {
            if (!currentProduct) return;
            const name = document.getElementById('reviewerName').value.trim();
            const comment = document.getElementById('reviewText').value.trim();
            if (!selectedRating) { alert('الرجاء اختيار تقييم'); return; }
            if (!comment) { alert('الرجاء كتابة تعليق'); return; }
            await db.ref('reviews').push().set({ productId:currentProduct.id, productName:currentProduct.name, rating:selectedRating, comment, reviewerName:name||'زائر', approved:true, createdAt:Date.now() });
            alert('✅ تم إضافة تقييمك! شكراً');
            document.getElementById('reviewerName').value = '';
            document.getElementById('reviewText').value = '';
            selectedRating = 0; updateRatingStarsUI(0);
            await loadReviews(); renderReviews(currentProduct.id);
        }

        function updateRatingStarsUI(rating) {
            document.querySelectorAll('#ratingInput .rating-star-btn').forEach((s,i) => {
                s.innerHTML = i < rating ? '★' : '☆';
                s.classList.toggle('active', i < rating);
            });
        }

        function setupRatingStars() {
            document.querySelectorAll('#ratingInput .rating-star-btn').forEach(s => {
                s.onclick = () => { selectedRating = parseInt(s.dataset.rating); updateRatingStarsUI(selectedRating); };
            });
        }

        function renderMarquee() {
            const top = [...products].sort((a,b)=>(parseFloat(b.price)||0)-(parseFloat(a.price)||0)).slice(0,12);
            if (!top.length) { document.getElementById('marqueeSection').style.display='none'; return; }
            const track = document.getElementById('marqueeTrack');
            track.innerHTML = [...top,...top].map(p => `
                <div class="marquee-item" onclick="scrollToProduct('${p.id}')">
                    <img src="${escapeHtml(p.image||'https://placehold.co/70x70')}" onerror="this.src='https://placehold.co/70x70'">
                    <div><div class="marquee-name">${escapeHtml(p.name)}</div><div class="marquee-price">${escapeHtml(p.price||'اتصل بنا')}</div></div>
                </div>`).join('');
            document.getElementById('marqueeSection').style.display = 'block';
        }

        function scrollToProduct(productId) {
            const el = document.querySelector(`.product-card:has([onclick*="${productId}"])`);
            if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
        }

        function generateFloatingProducts() {
            const container = document.getElementById('floatingBg');
            container.innerHTML = '';
            [...products].sort(()=>0.5-Math.random()).slice(0,15).forEach((p,i) => {
                container.innerHTML += `<div class="float-product" style="left:${Math.random()*90}%;top:${Math.random()*80}%;animation-delay:${i*1.5}s;animation-duration:${18+Math.random()*20}s;background-image:url('${escapeHtml(p.image||'')}');"></div>`;
            });
        }

        function openVideo(videoCode) {
            let id = videoCode;
            if (videoCode.includes('youtube.com/watch?v=')) id = videoCode.split('v=')[1]?.split('&')[0];
            else if (videoCode.includes('youtu.be/')) id = videoCode.split('youtu.be/')[1]?.split('?')[0];
            if (id) { document.getElementById('videoIframe').src = `https://www.youtube.com/embed/${id}?autoplay=1`; document.getElementById('videoModal').style.display='flex'; }
        }
        function closeVideoModal() { document.getElementById('videoModal').style.display='none'; document.getElementById('videoIframe').src=''; }

        function showProductDetails(productId) {
            const product = products.find(p => p.id===productId);
            if (!product) return;
            currentProduct = product;
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalImg').src = product.image||'https://placehold.co/400x300';
            document.getElementById('modalDesc').innerText = product.description||'لا يوجد وصف';
            const specs = product.specs || {};
            document.getElementById('modalSpecs').innerHTML = `<div class="font-bold mb-2">📋 المواصفات:</div>` + (Object.keys(specs).length ? Object.entries(specs).map(([k,v])=>`<div class="flex justify-between py-2 border-b border-white/10"><span class="text-[#d4af37]">${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`).join('') : '<p class="opacity-50">لا توجد مواصفات</p>');
            renderReviews(productId);
            setupRatingStars();
            selectedRating = 0; updateRatingStarsUI(0);
            document.getElementById('reviewerName').value = '';
            document.getElementById('reviewText').value = '';
            document.getElementById('productModal').style.display = 'flex';
        }

        function openOrderModalWithProduct(productId) {
            const product = products.find(p => p.id===productId);
            if (!product) return;
            currentProduct = product;
            openOrderModal();
        }

        // ========== [تحسين 2] نموذج الطلب بخطوتين ==========
        let currentStep = 1;

        function openOrderModal() {
            if (!currentProduct) return;
            currentStep = 1;
            showStep(1);
            document.getElementById('orderModal').style.display = 'flex';
        }

        function showStep(n) {
            currentStep = n;
            document.querySelectorAll('.step-panel').forEach((p,i) => p.classList.toggle('active', i+1===n));
            document.querySelectorAll('[id^="step-indicator-"]').forEach((el,i) => {
                el.classList.remove('active','done');
                if (i+1 < n) el.classList.add('done');
                else if (i+1 === n) el.classList.add('active');
            });
            if (n === 1) {
                document.querySelectorAll('.step-circle').forEach((c,i) => {
                    if (i < n-1) c.innerHTML = '<i class="fas fa-check" style="font-size:12px"></i>';
                    else c.textContent = i+1;
                });
            }
        }

        function goToStep2() {
            const name = document.getElementById('customerName').value.trim();
            const city = document.getElementById('customerCity').value;
            const district = document.getElementById('customerDistrict').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            if (!name || !city || !district || !phone) { alert('الرجاء ملء جميع الحقول المطلوبة (*)'); return; }
            const summary = document.getElementById('orderSummaryFull');
            summary.innerHTML = `
                <div class="order-summary-title">📦 مراجعة الطلب</div>
                <div class="order-summary-item"><span>المنتج:</span><span>${escapeHtml(currentProduct.name)}</span></div>
                <div class="order-summary-item"><span>السعر:</span><span style="color:#d4af37;font-weight:700">${escapeHtml(currentProduct.price||'اتصل بنا')}</span></div>
                <hr style="border-color:rgba(212,175,55,0.2);margin:10px 0">
                <div class="order-summary-item"><span>الاسم:</span><span>${escapeHtml(name)}</span></div>
                <div class="order-summary-item"><span>المحافظة:</span><span>${escapeHtml(city)}</span></div>
                <div class="order-summary-item"><span>المنطقة:</span><span>${escapeHtml(district)}</span></div>
                <div class="order-summary-item"><span>الهاتف:</span><span>${escapeHtml(phone)}</span></div>`;
            showStep(2);
        }

        function goToStep1() { showStep(1); }

        async function submitOrder() {
            const name = document.getElementById('customerName').value.trim();
            const city = document.getElementById('customerCity').value;
            const district = document.getElementById('customerDistrict').value.trim();
            const landmark = document.getElementById('customerLandmark').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const wp = settings.whatsappNumber || '';
            if (!wp) { alert('رقم الواتساب غير متوفر'); return; }
            const msg = `🛍️ *طلب جديد من متجر AKKAD STORE*\n\n━━━━━━━━━━━━━━━━━━━━\n👤 *معلومات العميل:*\n━━━━━━━━━━━━━━━━━━━━\n• الاسم: ${name}\n• المحافظة: ${city}\n• القضاء/المدينة: ${district}\n${landmark?`• أقرب نقطة دالة: ${landmark}\n`:''}\n• رقم الموبايل: ${phone}\n\n━━━━━━━━━━━━━━━━━━━━\n📦 *تفاصيل المنتج:*\n━━━━━━━━━━━━━━━━━━━━\n• المنتج: ${currentProduct.name}\n• السعر: ${currentProduct.price||'اتصل بنا'}\n\n━━━━━━━━━━━━━━━━━━━━\n📅 تاريخ الطلب: ${new Date().toLocaleString('ar')}\n━━━━━━━━━━━━━━━━━━━━\n🏺 شكراً لتسوقك من متجر أكاد`;
            try { await db.ref('orders').push().set({ customerName:name, customerCity:city, customerDistrict:district, customerLandmark:landmark, customerPhone:phone, productName:currentProduct.name, productPrice:currentProduct.price, productId:currentProduct.id, status:'جديد', createdAt:Date.now() }); } catch(e) { console.error(e); }
            window.open(`https://wa.me/${wp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
            closeOrderModal();
            closeModal();
            alert('✅ تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
            document.getElementById('customerName').value = '';
            document.getElementById('customerCity').value = '';
            document.getElementById('customerDistrict').value = '';
            document.getElementById('customerLandmark').value = '';
            document.getElementById('customerPhone').value = '';
            showStep(1);
        }

        function shareStore() {
            if (navigator.share) navigator.share({ title:'AKKAD STORE', text:'تسوق أفضل المنتجات من متجر أكاد', url:window.location.href });
            else { navigator.clipboard.writeText(window.location.href); alert('✅ تم نسخ رابط المتجر'); }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.querySelector('.header-left .top-btn:last-child i');
            icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function closeModal() { document.getElementById('productModal').style.display='none'; currentProduct=null; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

        loadData();
        listenToUpdates();
    </script>
</body>
</html>
