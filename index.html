<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AKKAD STORE | متجر أكاد الرقمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');
        
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-light: #eef2ff;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 4px 12px rgba(15,23,42,0.06);
            --shadow-lg: 0 8px 24px rgba(15,23,42,0.12);
            --radius: 16px;
            --trans: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode {
            --bg: #0b1120;
            --surface: #151d2f;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --accent-light: #1e1b4b;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; max-width: 100vw; overflow-x: hidden; }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        header { 
            position: sticky; top: 0; z-index: 50; 
            background: rgba(248,250,252,0.85); 
            backdrop-filter: blur(16px); 
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            transition: var(--trans);
        }
        body.dark-mode header { background: rgba(11,17,32,0.9); }
        header.scrolled { padding: 10px 20px; box-shadow: var(--shadow); }
        .h-flex { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo { width: 44px; height: 44px; border-radius: 12px; object-fit: contain; background: var(--surface); box-shadow: var(--shadow); }
        .brand { font-size: 1.2rem; font-weight: 900; letter-spacing: -0.5px; }
        .brand span { color: var(--accent); }
        
        .search-modern { 
            flex: 1; max-width: 420px; margin: 0 16px;
            display: flex; align-items: center; 
            background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 14px; gap: 8px;
            transition: var(--trans);
        }
        .search-modern:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .search-modern input { background: transparent; border: none; color: var(--text); font-size: 14px; width: 100%; outline: none; font-family: 'Tajawal'; }
        .search-modern input::placeholder { color: var(--text-muted); }
        .search-modern button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; transition: var(--trans); }
        .search-modern:focus-within button { color: var(--accent); }

        .nav-actions { display: flex; align-items: center; gap: 6px; }
        .icon-btn { 
            width: 40px; height: 40px; border-radius: 10px; 
            background: var(--surface); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--trans); color: var(--text-muted); font-size: 1.1rem; position: relative;
            border: 1px solid var(--border);
        }
        .icon-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-2px); }
        .badge { 
            position: absolute; top: -4px; right: -4px; 
            background: var(--danger); color: #fff; 
            font-size: 10px; font-weight: 800; width: 16px; height: 16px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--surface); opacity: 0; transition: 0.2s;
        }
        .badge.show { opacity: 1; }

        .hero { 
            padding: 48px 20px 56px; 
            background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
            border-bottom: 1px solid var(--border);
        }
        .hero-content { max-width: 1100px; margin: 0 auto; }
        .hero h1 { 
            font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 900; 
            line-height: 1.3; margin-bottom: 14px; color: var(--text);
        }
        .hero p { font-size: 1.05rem; color: var(--text-muted); max-width: 550px; margin-bottom: 24px; line-height: 1.6; }
        .hero-stats { display: flex; gap: 16px; flex-wrap: wrap; }
        .stat-card { 
            background: var(--surface); padding: 14px 20px; border-radius: 14px; 
            box-shadow: var(--shadow); border: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .stat-icon { width: 42px; height: 42px; border-radius: 10px; background: var(--accent-light); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 1.1rem; }
        .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--text); }
        .stat-lbl { font-size: 0.8rem; color: var(--text-muted); }

        .cats { padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
        .cats-scroll { display: flex; gap: 8px; padding: 4px 0; scrollbar-width: none; }
        .cats-scroll::-webkit-scrollbar { display: none; }
        .cat-pill { 
            flex-shrink: 0; padding: 9px 20px; border-radius: 100px; 
            background: var(--bg); color: var(--text-muted); font-weight: 600; font-size: 0.9rem;
            cursor: pointer; transition: var(--trans); border: 1px solid var(--border); white-space: nowrap;
        }
        .cat-pill:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
        .cat-pill.active { 
            background: var(--accent); color: #fff; border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(79,70,229,0.25);
        }

        .products { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
        .section-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; color: var(--text); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { 
            background: var(--surface); border-radius: var(--radius); overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            transition: var(--trans); cursor: pointer; position: relative;
        }
        .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .card-img-box { 
            position: relative; background: var(--bg); padding: 16px; 
            min-height: 190px; display: flex; align-items: center; justify-content: center;
        }
        .card-img { max-width: 100%; max-height: 160px; object-fit: contain; transition: transform 0.3s ease; }
        .card:hover .card-img { transform: scale(1.04); }
        .card-badge { 
            position: absolute; top: 10px; right: 10px; padding: 4px 10px; 
            border-radius: 100px; font-size: 11px; font-weight: 700; z-index: 5; color: #fff;
        }
        .badge-new { background: var(--success); }
        .badge-sale { background: var(--danger); }
        .badge-hot { background: var(--accent); }

        .video-overlay {
            position: absolute; inset: 0; background: rgba(15,23,42,0.4); display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.25s; cursor: pointer; border-radius: var(--radius); z-index: 10;
        }
        .card-img-box:hover .video-overlay { opacity: 1; }
        .play-icon {
            width: 48px; height: 48px; background: rgba(255,255,255,0.95); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
            transition: transform 0.2s; color: var(--accent); font-size: 1.2rem;
        }
        .play-icon:hover { transform: scale(1.1); }
        .video-badge {
            position: absolute; top: 10px; left: 10px; background: rgba(15,23,42,0.85); color: #fff;
            padding: 5px 12px; border-radius: 100px; font-size: 11px; font-weight: 700;
            display: flex; align-items: center; gap: 5px; backdrop-filter: blur(4px); z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .card-body { padding: 14px; }
        .card-body h3 { font-weight: 700; font-size: 1rem; margin-bottom: 6px; color: var(--text); }
        .card-stars { display: flex; gap: 2px; margin-bottom: 8px; direction: ltr; }
        .card-stars .star { color: #cbd5e1; font-size: 12px; }
        .card-stars .star.active { color: #f59e0b; }
        .card-price { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
        .card-actions { display: flex; gap: 6px; align-items: center; }
        
        .btn-wa-sm { 
            flex: 1.2; padding: 10px; border-radius: 10px; background: var(--success); 
            color: #fff; font-weight: 700; font-size: 0.85rem; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: var(--trans);
        }
        .btn-wa-sm:hover { background: #059669; transform: translateY(-1px); }
        
        .btn-details-sm {
            flex: 1; padding: 10px; border-radius: 10px; background: var(--bg);
            border: 1px solid var(--border); color: var(--text-muted); font-weight: 600; font-size: 0.85rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: var(--trans);
        }
        .btn-details-sm:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
        
        .btn-cart-sm { 
            width: 40px; height: 40px; border-radius: 10px; background: var(--bg); 
            border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); transition: var(--trans); flex-shrink: 0;
        }
        .btn-cart-sm:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-cart-sm.added { background: var(--accent); color: #fff; border-color: var(--accent); }

        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); 
            z-index: 1000; align-items: center; justify-content: center;
            backdrop-filter: blur(6px); padding: 16px; opacity: 0; transition: opacity 0.2s;
        }
        .modal.active { opacity: 1; }
        .modal-box { 
            background: var(--surface); border-radius: 20px; max-width: 580px; width: 100%; 
            max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg);
            border: 1px solid var(--border); transform: translateY(10px); transition: transform 0.25s;
        }
        .modal.active .modal-box { transform: translateY(0); }

        .toast { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--surface); color: var(--text); padding: 12px 20px; border-radius: 12px;
            font-size: 0.9rem; z-index: 9999; box-shadow: var(--shadow-lg);
            animation: toastIn 0.3s ease, toastOut 0.3s 2s forwards;
            display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

        .skeleton { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .sk-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
        .sk-img { height: 190px; background: linear-gradient(90deg, var(--bg) 25%, var(--border) 50%, var(--bg) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
        .sk-line { height: 14px; background: linear-gradient(90deg, var(--bg) 25%, var(--border) 50%, var(--bg) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; margin: 12px 14px; }
        .sk-line.short { width: 60%; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .loader { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 40px auto; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer { background: var(--surface); border-top: 1px solid var(--border); padding: 32px 20px; margin-top: 50px; text-align: center; }
        .f-social { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .f-social a { 
            width: 44px; height: 44px; border-radius: 10px; background: var(--bg); 
            display: flex; align-items: center; justify-content: center;
            transition: var(--trans); color: var(--text-muted); text-decoration: none; font-size: 1.1rem;
            border: 1px solid var(--border);
        }
        .f-social a:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-2px); }
        .copyright { font-size: 0.82rem; color: var(--text-muted); line-height: 1.7; }

        @media (max-width: 768px) {
            .h-flex { flex-direction: column; gap: 10px; }
            .search-modern { max-width: 100%; margin: 0; }
            .hero { padding: 32px 16px 40px; }
            .hero h1 { font-size: 1.7rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
            .card-img-box { min-height: 150px; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .nav-actions { gap: 4px; }
            .card-actions { flex-direction: row; }
        }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="h-flex">
            <div class="logo-area">
                <img id="storeLogo" src="https://placehold.co/44x44" alt="Logo" class="logo">
                <div class="brand">AKKAD <span>STORE</span></div>
            </div>
            <div class="search-modern">
                <input type="text" id="searchIn" placeholder="ابحث عن منتج..." onkeyup="searchProducts()">
                <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="تبديل المظهر"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button class="icon-btn" onclick="openCart()" title="السلة"><i class="fas fa-shopping-bag"></i><span class="badge" id="cartBadge">0</span></button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>أحدث الأجهزة الإلكترونية<br>بأفضل الأسعار</h1>
            <p>اكتشف مجموعتنا المختارة من أجهزة الترفيه الرقمي مع توصيل سريع وآمن لجميع المحافظات</p>
            <div class="hero-stats">
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-box"></i></div><div><div class="stat-val" id="sProd">0</div><div class="stat-lbl">منتج</div></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-star"></i></div><div><div class="stat-val" id="sRev">0</div><div class="stat-lbl">تقييم</div></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-truck"></i></div><div><div class="stat-val">عراق</div><div class="stat-lbl">توصيل سريع</div></div></div>
            </div>
        </div>
    </section>

    <div class="cats"><div class="cats-scroll" id="catsCont"></div></div>

    <div class="products">
        <div class="section-title">المنتجات المميزة</div>
        <div class="skeleton" id="skCont"></div>
        <div class="grid" id="prodCont" style="display: none;"></div>
        <div class="loader" id="loader"></div>
    </div>

    <footer>
        <div class="f-social" id="fSocial"></div>
        <div class="copyright">© 2024-2026 متجر أكاد الرقمي<br>جميع الحقوق محفوظة</div>
    </footer>

    <div id="prodModal" class="modal" onclick="if(event.target===this)closeModal('prodModal')">
        <div class="modal-box">
            <div class="flex justify-between items-center p-4 border-b border-[var(--border)]">
                <h3 id="mTitle" class="text-lg font-bold text-[var(--accent)]"></h3>
                <button onclick="closeModal('prodModal')" class="text-xl text-[var(--text-muted)] hover:text-[var(--accent)]"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4">
                <img id="mImg" src="" class="w-full rounded-xl mb-4" style="max-height:220px;object-fit:contain;background:var(--bg);padding:16px">
                <p id="mDesc" class="text-sm text-[var(--text-muted)] mb-4 leading-relaxed"></p>
                <div id="mSpecs" class="bg-[var(--bg)] rounded-xl p-4 mb-4 text-sm"></div>
                <div class="mb-4">
                    <div class="font-bold text-[var(--accent)] mb-3">التقييمات</div>
                    <div id="revCont" class="text-[var(--text-muted)] text-sm"></div>
                </div>
                <div class="flex gap-3">
                    <button onclick="closeModal('prodModal');openOrder()" class="flex-1 btn-wa-sm"><i class="fab fa-whatsapp"></i> طلب الآن</button>
                    <button onclick="addToCartFromModal()" class="btn-cart-sm" id="mCartBtn" style="width:auto;padding:0 14px"><i class="fas fa-shopping-bag"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="vidModal" class="modal" onclick="if(event.target===this)closeModal('vidModal')">
        <div class="modal-box p-2">
            <div class="flex justify-between items-center px-2 py-1">
                <span class="text-sm font-bold text-[var(--text-muted)]">معاينة الفيديو</span>
                <button onclick="closeModal('vidModal')" class="text-lg text-[var(--text-muted)] hover:text-[var(--accent)]"><i class="fas fa-times"></i></button>
            </div>
            <iframe id="vidFrame" class="w-full rounded-lg bg-black" style="aspect-ratio:16/9" src="" allowfullscreen></iframe>
        </div>
    </div>

    <div id="cartModal" class="modal" onclick="if(event.target===this)closeModal('cartModal')">
        <div class="modal-box">
            <div class="flex justify-between items-center p-4 border-b border-[var(--border)]">
                <h3 class="text-lg font-bold">سلة التسوق</h3>
                <button onclick="closeModal('cartModal')" class="text-xl text-[var(--text-muted)] hover:text-[var(--accent)]"><i class="fas fa-times"></i></button>
            </div>
            <div id="cartItems" class="p-4"></div>
            <div id="cartFoot" class="p-4 border-t border-[var(--border)]"></div>
        </div>
    </div>

    <div id="orderModal" class="modal" onclick="if(event.target===this)closeModal('orderModal')">

            <div class="p-4 border-b border-[var(--border)]"><h3 class="text-lg font-bold">إتمام الطلب</h3></div>
            <div class="p-4 space-y-4">
                <div><label class="block text-sm font-bold mb-2">الاسم الكامل *</label><input type="text" id="cName" class="w-full p-3 bg-[var(--bg)] rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold mb-2">المحافظة *</label>
                        <select id="cCity" class="w-full p-3 bg-[var(--bg)] rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none">
                            <option value="">اختر المحافظة</option>
                            <option>بغداد</option>
                            <option>البصرة</option>
                            <option>نينوى</option>
                            <option>أربيل</option>
                            <option>السليمانية</option>
                            <option>دهوك</option>
                            <option>كركوك</option>
                            <option>صلاح الدين</option>
                            <option>ديالى</option>
                            <option>الأنبار</option>
                            <option>كربلاء</option>
                            <option>النجف</option>
                            <option>بابل</option>
                            <option>واسط</option>
                            <option>ميسان</option>
                            <option>ذي قار</option>
                            <option>المثنى</option>
                            <option>القادسية</option>
                        </select>
                    </div>
                    <div><label class="block text-sm font-bold mb-2">المنطقة / القضاء *</label><input type="text" id="cDist" class="w-full p-3 bg-[var(--bg)] rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none"></div>
                </div>
                <div><label class="block text-sm font-bold mb-2">رقم الموبايل *</label><input type="tel" id="cPhone" class="w-full p-3 bg-[var(--bg)] rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none"></div>
                <div><label class="block text-sm font-bold mb-2">أقرب نقطة دالة (اختياري)</label><input type="text" id="cLand" class="w-full p-3 bg-[var(--bg)] rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none"></div>
                <button onclick="submitOrder()" class="w-full btn-wa-sm py-3"><i class="fab fa-whatsapp"></i> تأكيد وإرسال</button>
                <button onclick="closeModal('orderModal')" class="w-full p-3 bg-[var(--bg)] rounded-xl border border-[var(--border)] font-bold hover:bg-[var(--border)] transition">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey:"AIzaSyAEH25yJ-pwfgFUMjLZNgDyNqw8Rcv9S6E", authDomain:"akkad-store-ab5a1.firebaseapp.com", databaseURL:"https://akkad-store-ab5a1-default-rtdb.firebaseio.com", projectId:"akkad-store-ab5a1", storageBucket:"akkad-store-ab5a1.firebasestorage.app", messagingSenderId:"456810444639", appId:"1:456810444639:web:a706dc19781cd7738e28ea" };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let cats=[], prods=[], revs=[], settings={}, social={};
        let curCat='all', curProd=null, q='';
        let cart = JSON.parse(localStorage.getItem('akkad_cart')||'[]');

        function eH(s){return s?String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]):''}
        function closeModal(id){const el=document.getElementById(id);el.style.display='none';el.classList.remove('active');document.body.style.overflow=''}
        function openModal(id){const el=document.getElementById(id);el.style.display='flex';setTimeout(()=>el.classList.add('active'),10);document.body.style.overflow='hidden'}
        function showToast(msg){const e=document.querySelector('.toast');if(e)e.remove();const t=document.createElement('div');t.className='toast';t.innerHTML=`تم: ${msg}`;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
        
        function saveCart(){localStorage.setItem('akkad_cart',JSON.stringify(cart));updateCartUI()}
        function updateCartUI(){const t=cart.reduce((s,i)=>s+i.qty,0);const b=document.getElementById('cartBadge');if(b){b.textContent=t;b.classList.toggle('show',t>0)}}
        function formatPrice(p){if(!p)return'اتصل بنا';const n=parseFloat(p);return !isNaN(n)&&p.toString().trim()===n.toString()?n.toLocaleString('ar-IQ')+' د.ع':p}
        
        function addToCart(id){
            const p=prods.find(x=>x.id===id);if(!p)return;
            const ex=cart.find(i=>i.id===id);if(ex)ex.qty++;else cart.push({id:p.id,name:p.name,price:p.price,image:p.image,qty:1});
            saveCart();showToast(`تمت إضافة "${p.name}" للسلة`);
            const b=document.getElementById(`cb-${id}`);if(b){b.classList.add('added');b.innerHTML='<i class="fas fa-check"></i>'}
        }
        function addToCartFromModal(){if(!curProd)return;addToCart(curProd.id);const b=document.getElementById('mCartBtn');if(b){b.classList.add('added');b.innerHTML='<i class="fas fa-check"></i>'}}
        function removeFromCart(id){cart=cart.filter(i=>i.id!==id);saveCart();renderCart()}
        function changeQty(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.qty=Math.max(1,i.qty+d);saveCart();renderCart()}
        function clearCart(){if(!confirm('هل تريد تفريغ السلة؟'))return;cart=[];saveCart();renderCart()}
        function openCart(){renderCart();openModal('cartModal')}
        
        function renderCart(){
            const c=document.getElementById('cartItems'),f=document.getElementById('cartFoot');
            if(!cart.length){c.innerHTML='<div class="text-center py-8 text-[var(--text-muted)]">السلة فارغة حالياً</div>';f.innerHTML='<button onclick="closeModal(\'cartModal\')" class="w-full p-3 bg-[var(--accent)] text-white rounded-xl font-bold hover:bg-[var(--accent-hover)] transition">العودة للمتجر</button>';return}
            c.innerHTML=cart.map(i=>`<div class="flex items-center gap-3 p-3 bg-[var(--bg)] rounded-xl mb-3 border border-[var(--border)]"><img src="${eH(i.image||'https://placehold.co/60')}" class="w-14 h-14 rounded-lg object-cover"><div class="flex-1"><div class="font-bold text-sm">${eH(i.name)}</div><div class="text-[var(--accent)] font-bold text-sm">${formatPrice(i.price)}</div><div class="flex items-center gap-2 mt-2"><button onclick="changeQty('${i.id}',-1)" class="w-7 h-7 rounded-md bg-[var(--surface)] border border-[var(--border)]">-</button><span class="text-sm font-bold">${i.qty}</span><button onclick="changeQty('${i.id}',1)" class="w-7 h-7 rounded-md bg-[var(--surface)] border border-[var(--border)]">+</button></div></div><button onclick="removeFromCart('${i.id}')" class="text-[var(--danger)]"><i class="fas fa-trash"></i></button></div>`).join('');
            const total = cart.reduce((s,i)=>s+(parseFloat(i.price||0)*i.qty),0);
            f.innerHTML=`<div class="flex justify-between items-center mb-3"><span class="font-bold">الإجمالي:</span><span class="text-[var(--accent)] font-bold text-lg">${total.toLocaleString('ar-IQ')} د.ع</span></div><button onclick="checkoutCart()" class="w-full btn-wa-sm py-3"><i class="fab fa-whatsapp"></i> إرسال الطلب</button><button onclick="clearCart()" class="w-full p-3 text-[var(--danger)] mt-2 text-sm font-bold hover:bg-[var(--bg)] rounded-lg">تفريغ السلة</button>`;
        }
        
        function checkoutCart(){
            if(!cart.length)return;
            const w=settings.whatsappLink||settings.whatsappNumber||'9647730492020';
            const l=cart.map(i=>`• ${eH(i.name)} × ${i.qty}`).join('\n');
            window.open(`https://wa.me/${w.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(`طلب جديد من AKKAD STORE\n\n${l}\n\nالتاريخ: ${new Date().toLocaleDateString('ar-IQ')}`)}`,'_blank');
            closeModal('cartModal');
        }

        async function loadData(){
            document.getElementById('skCont').style.display='grid';
            document.getElementById('prodCont').style.display='none';
            try {
                await Promise.all([loadCats(),loadProds(),loadRevs(),loadSet(),loadSoc()]);
                renderCats();renderProds();updLogo();rendSoc();updateCartUI();updStats();
            } catch(e) {
                console.error('خطأ في تحميل البيانات:', e);
                showToast('حدث خطأ في تحميل البيانات');
            } finally {
                document.getElementById('skCont').style.display='none';
                document.getElementById('prodCont').style.display='grid';
            }
        }
        async function loadCats(){const s=await db.ref('categories').once('value');const d=s.val();cats=d?Object.entries(d).map(([id,v])=>({id,name:v.name,order:v.order||0})).sort((a,b)=>a.order-b.order):[]}
        async function loadProds(){const s=await db.ref('products').once('value');const d=s.val();prods=d?Object.entries(d).map(([id,v])=>({id,...v})):[]}
        async function loadRevs(){const s=await db.ref('reviews').once('value');const d=s.val();revs=d?Object.entries(d).map(([id,v])=>({id,...v})):[]}
        async function loadSet(){const s=await db.ref('settings').once('value');settings=s.val()||{}}
        async function loadSoc(){const s=await db.ref('social').once('value');social=s.val()||{}}
        
        function updLogo(){if(settings.storeLogo)document.getElementById('storeLogo').src=settings.storeLogo}
        
        function rendSoc(){
            const w=settings.whatsappLink||settings.whatsappNumber;
            const fb=social.facebookLink||settings.social?.fl;
            const ig=social.instagramLink||settings.social?.il;
            const tg=social.telegramLink||settings.social?.tl;
            const links=[{i:'fab fa-whatsapp',l:w?`https://wa.me/${w.replace(/[^0-9]/g,'')}`:null},{i:'fab fa-facebook',l:fb},{i:'fab fa-instagram',l:ig},{i:'fab fa-telegram',l:tg}].filter(x=>x.l);
            document.getElementById('fSocial').innerHTML=links.map(x=>`<a href="${x.l}" target="_blank"><i class="${x.i}"></i></a>`).join('');
        }
        
        function updStats(){document.getElementById('sProd').textContent=prods.length;document.getElementById('sRev').textContent=revs.filter(r=>r.approved!==false).length}
        function searchProducts(){q=document.getElementById('searchIn').value.toLowerCase().trim();renderProds()}
        
        function listenToUpdates(){
            db.ref('products').on('value',s=>{prods=s.val()?Object.entries(s.val()).map(([id,v])=>({id,...v})):[];renderProds();renderCats();updStats()});
            db.ref('categories').on('value',s=>{cats=s.val()?Object.entries(s.val()).map(([id,v])=>({id,name:v.name,order:v.order||0})).sort((a,b)=>a.order-b.order):[];renderCats();renderProds()});
            db.ref('reviews').on('value',s=>{revs=s.val()?Object.entries(s.val()).map(([id,v])=>({id,...v})):[];updStats()});
            db.ref('settings').on('value',s=>{settings=s.val()||{};updLogo();rendSoc()});
            db.ref('social').on('value',s=>{social=s.val()||{};rendSoc()});
        }
        
        // ✅ تم تعديل هذه الدالة لإزالة الأرقام من الأقسام
        function renderCats(){
            const c=document.getElementById('catsCont');
            // تم حذف (prods.length) و (counts[cat.name])
            c.innerHTML=`<div class="cat-pill ${curCat==='all'?'active':''}" onclick="filterBy('all')">الكل</div>`;
            cats.forEach(cat=>{c.innerHTML+=`<div class="cat-pill ${curCat===cat.name?'active':''}" onclick="filterBy('${eH(cat.name)}')">${eH(cat.name)}</div>`});
        }
        function filterBy(name){curCat=name;renderCats();renderProds()}
        
        function getRate(id){const r=revs.filter(x=>x.productId===id&&x.approved!==false);if(!r.length)return{avg:0,count:0};return{avg:r.reduce((s,x)=>s+x.rating,0)/r.length,count:r.length}}
        
        function renderProds(){
            const c=document.getElementById('prodCont');
            let f=prods;
            if(curCat!=='all')f=f.filter(p=>p.category===curCat);
            if(q)f=f.filter(p=>p.name?.toLowerCase().includes(q)||p.description?.toLowerCase().includes(q));
            
            if(!f.length){
                c.innerHTML=`<div class="col-span-full text-center py-12 text-[var(--text-muted)] bg-[var(--surface)] rounded-xl border border-[var(--border)]">${q?'لا توجد نتائج مطابقة للبحث':'لا توجد منتجات متاحة حالياً'}</div>`;
                return;
            }
            c.innerHTML='';
            f.forEach(p=>{
                const vid = p.video || p.videoCode || p.videoUrl || p.link || '';
                const hasV = vid.trim().length > 3;
                const rt=getRate(p.id),inC=cart.find(i=>i.id===p.id);let b='';const now=Date.now(),cr=p.createdAt||now;
                if(now-cr<604800000)b=`<span class="card-badge badge-new">جديد</span>`;
                else if(p.discount>0)b=`<span class="card-badge badge-sale">خصم ${p.discount}%</span>`;
                else if(rt.count>=5)b=`<span class="card-badge badge-hot">مميز</span>`;
                
                c.innerHTML+=`<div class="card" data-id="${p.id}">${b}<div class="card-img-box"><img src="${eH(p.image||'https://placehold.co/400x300')}" class="card-img" loading="lazy" onerror="this.src='https://placehold.co/400x300'">${hasV?`<div class="video-overlay" onclick="event.stopPropagation();openVideo('${vid}')"><div class="play-icon"><i class="fas fa-play"></i></div></div><span class="video-badge"><i class="fas fa-video"></i> فيديو</span>`:''}</div><div class="card-body"><h3>${eH(p.name)}</h3><div class="card-stars">${renderS(rt.avg)}<span class="text-xs text-[var(--text-muted)] mr-1">(${rt.count})</span></div><div class="card-price">${formatPrice(p.price)}</div><div class="card-actions"><button onclick="event.stopPropagation();showDetails('${p.id}')" class="btn-wa-sm"><i class="fab fa-whatsapp"></i> طلب</button><button onclick="event.stopPropagation();showDetails('${p.id}')" class="btn-details-sm"><i class="fas fa-info-circle"></i> التفاصيل</button><button id="cb-${p.id}" onclick="event.stopPropagation();addToCart('${p.id}')" class="btn-cart-sm ${inC?'added':''}"><i class="fas ${inC?'fa-check':'fa-shopping-bag'}"></i></button></div></div></div>`;
            });
        }
        function renderS(r){let s='';for(let i=1;i<=5;i++)s+=`<span class="star ${i<=Math.round(r)?'active':''}">★</span>`;return s}
        
        function showDetails(id){
            const p=prods.find(x=>x.id===id);if(!p)return;curProd=p;
            document.getElementById('mTitle').innerText=p.name;
            document.getElementById('mImg').src=p.image||'https://placehold.co/400x300';
            document.getElementById('mDesc').innerText=p.description||'لا يوجد وصف متاح لهذا المنتج';
            const sp=p.specs||{};
            document.getElementById('mSpecs').innerHTML=Object.keys(sp).length?Object.entries(sp).map(([k,v])=>`<div class="flex justify-between py-2 border-b border-[var(--border)]"><span class="text-[var(--text-muted)]">${eH(k)}</span><span class="font-bold">${eH(v)}</span></div>`).join(''):'<p class="text-[var(--text-muted)]">لا توجد مواصفات مضافة</p>';
            renderRevs(id);
            const inC=cart.find(i=>i.id===id),b=document.getElementById('mCartBtn');
            if(b){if(inC){b.classList.add('added');b.innerHTML='<i class="fas fa-check"></i>'}else{b.classList.remove('added');b.innerHTML='<i class="fas fa-shopping-bag"></i>'}}
            openModal('prodModal');
        }
        function renderRevs(id){
            const c=document.getElementById('revCont'),rl=revs.filter(x=>x.productId===id&&x.approved!==false);
            c.innerHTML=rl.length?rl.map(x=>`<div class="p-3 bg-[var(--bg)] rounded-lg mb-2 border border-[var(--border)]"><div class="flex justify-between mb-1"><span class="font-bold text-sm">${eH(x.reviewerName||'عميل')}</span><span class="text-xs text-[var(--text-muted)]">${new Date(x.createdAt).toLocaleDateString('ar-IQ')}</span></div><div class="text-sm">${eH(x.comment)}</div></div>`).join(''):'<div class="text-[var(--text-muted)] text-center py-4">لا توجد تقييمات حالياً</div>';
        }
        
        function openVideo(code){
            let id=code;
            if(code.includes('v=')) id=code.split('v=')[1]?.split('&')[0];
            else if(code.includes('youtu.be/')) id=code.split('/').pop();
            if(id){
                document.getElementById('vidFrame').src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
                openModal('vidModal');
            } else {
                showToast('رابط الفيديو غير صحيح');
            }
        }

        function openOrder(){if(!curProd)return;openModal('orderModal')}
        async function submitOrder(){
            const n=document.getElementById('cName').value.trim(),c=document.getElementById('cCity').value,d=document.getElementById('cDist').value.trim(),l=document.getElementById('cLand').value.trim(),p=document.getElementById('cPhone').value.trim();
            if(!n||!c||!d||!p){showToast('يرجى تعبئة جميع الحقول المطلوبة');return}
            const w=settings.whatsappLink||settings.whatsappNumber||'9647730492020';
            try{await db.ref('orders').push().set({customerName:n,customerCity:c,customerDistrict:d,customerLandmark:l,customerPhone:p,productName:curProd.name,productPrice:curProd.price,productId:curProd.id,status:'جديد',createdAt:Date.now()})}catch(e){console.error(e)}
            window.open(`https://wa.me/${w.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(`طلب جديد\nالاسم: ${n}\nالموقع: ${c} - ${d}\nالموبايل: ${p}\nالمنتج: ${curProd.name}\nالسعر: ${curProd.price}`)}`,'_blank');
            closeModal('orderModal');closeModal('prodModal');
        }
        
        function toggleTheme(){
            document.body.classList.toggle('dark-mode');
            const isDark=document.body.classList.contains('dark-mode');
            document.getElementById('themeIcon').className=isDark?'fas fa-sun':'fas fa-moon';
            localStorage.setItem('akkad_theme',isDark?'dark':'light');
        }
        function applySavedTheme(){
            const saved=localStorage.getItem('akkad_theme');
            if(saved==='dark'){document.body.classList.add('dark-mode');document.getElementById('themeIcon').className='fas fa-sun'}
        }
        
        window.addEventListener('scroll',()=>{const h=document.getElementById('mainHeader');if(h)h.classList.toggle('scrolled',window.scrollY>40)});
        document.addEventListener('DOMContentLoaded',()=>{applySavedTheme();loadData();listenToUpdates()});
    </script>
</body>
</html>
