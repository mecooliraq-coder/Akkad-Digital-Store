<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>أكاد | متجر بلاد الرافدين الرقمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        
        :root {
            --bg-primary: #0a0f12;
            --bg-secondary: #0f151a;
            --bg-card: rgba(20, 26, 31, 0.65);
            --text-primary: #e8e2d4;
            --text-secondary: #a0a0a0;
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #d4af37, #b8942e, #9a7a28);
            --border-light: rgba(212, 175, 55, 0.25);
            --shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        body.light-mode {
            --bg-primary: #f5f5f0;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.85);
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --gold: #b8942e;
            --border-light: rgba(184, 148, 46, 0.3);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            min-height: 100vh; 
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        /* خلفية الحروف المسمارية */
        .cuneiform-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        
        .cuneiform-text {
            position: absolute;
            font-size: clamp(60px, 15vw, 180px);
            font-weight: bold;
            opacity: 0.04;
            white-space: nowrap;
            animation: floatCuneiform 25s linear infinite;
            color: var(--gold);
            user-select: none;
        }
        
        @keyframes floatCuneiform {
            0% { transform: translateX(100%) translateY(0) rotate(0deg); opacity: 0.02; }
            50% { opacity: 0.08; }
            100% { transform: translateX(-100%) translateY(-50px) rotate(5deg); opacity: 0.02; }
        }
        
        .bg-pattern { 
            position: fixed; 
            inset: 0; 
            z-index: -2; 
            background: radial-gradient(ellipse at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            animation: slowZoom 30s ease-in-out infinite alternate; 
        }
        
        @keyframes slowZoom { 
            0% { transform: scale(1); } 
            100% { transform: scale(1.03); } 
        }
        
        .gold-border-bottom { border-bottom: 2px solid var(--gold); }
        
        .theme-toggle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-gold { background: var(--gold-gradient); color: #0a0f12; font-weight: 700; transition: all 0.3s ease; border: none; border-radius: 12px; cursor: pointer; }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4); }
        
        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: 1.5rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
        }
        
        .media-box { 
            height: 200px; 
            position: relative; 
            overflow: hidden; 
            cursor: pointer; 
            background: #0a0f12; 
        }
        
        .media-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transition: transform 0.4s ease; 
            padding: 10px; 
        }
        
        .product-card:hover .media-box img { transform: scale(1.08); }
        
        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
            border-radius: 1.5rem;
            cursor: pointer;
        }
        
        .video-overlay i { font-size: 55px; color: var(--gold); }
        .media-box:hover .video-overlay { opacity: 1; }
        
        .video-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--gold-gradient);
            color: #0a0f12;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .categories-scroll {
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 12px;
            padding-bottom: 10px;
            scrollbar-width: thin;
        }
        
        .cat-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-light);
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-primary);
        }
        
        .cat-btn.active {
            background: var(--gold-gradient);
            color: #0a0f12;
            border-color: var(--gold);
        }
        
        /* شريط متحرك بالصور */
        .marquee-section {
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.08), transparent);
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 15px 0;
            overflow: hidden;
            margin: 20px 0 30px;
        }
        
        .marquee-track {
            display: flex;
            gap: 25px;
            width: max-content;
            animation: scrollMarquee var(--marquee-speed, 30s) linear infinite;
        }
        
        .marquee-section:hover .marquee-track { animation-play-state: paused; }
        
        @keyframes scrollMarquee {
            from { transform: translateX(-50%); }
            to { transform: translateX(0); }
        }
        
        .marquee-item {
            width: 260px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-light);
        }
        
        .marquee-item:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.15);
            transform: translateY(-3px);
        }
        
        .marquee-item img { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; }
        
        /* مودال */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 18, 0.98);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(15px);
        }
        
        .modal-content {
            background: linear-gradient(145deg, #141a1f, #0f1419);
            border-radius: 1.5rem;
            padding: 1.75rem;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--gold);
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .video-modal {
            width: 90%;
            max-width: 800px;
            background: black;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--gold);
        }
        
        .video-modal iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        
        .footer { border-top: 1px solid var(--border-light); margin-top: 40px; padding: 30px 20px; text-align: center; background: var(--bg-card); backdrop-filter: blur(10px); }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .social-icons a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: var(--text-primary);
            text-decoration: none;
            border: 1px solid var(--border-light);
        }
        .social-icons a:hover { background: var(--gold); color: #0a0f12; transform: translateY(-5px); }
        
        .loading { text-align: center; padding: 60px; }
        .loader { width: 50px; height: 50px; border: 3px solid rgba(212,175,55,0.2); border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gold-gradient);
            color: #0a0f12;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 99;
        }
        .scroll-top.visible { opacity: 1; visibility: visible; }
        
        @media (max-width: 768px) {
            .media-box { height: 160px; }
            .marquee-item { width: 220px; }
            .marquee-item img { width: 55px; height: 55px; }
        }
    </style>
</head>
<body>
    <div class="cuneiform-bg">
        <div class="cuneiform-text" style="top: 5%; left: -10%; animation-duration: 20s;">𒀭𒈾𒀜𒈾𒀭</div>
        <div class="cuneiform-text" style="top: 25%; right: -5%; animation-duration: 28s;">𒈠𒀀𒉡𒈠𒀀</div>
        <div class="cuneiform-text" style="bottom: 15%; left: -15%; animation-duration: 32s;">𒀝𒆥𒀝𒆥𒁺</div>
        <div class="cuneiform-text" style="top: 60%; right: -8%; animation-duration: 25s;">𒀭𒀜𒈾𒀭𒀜</div>
        <div class="cuneiform-text" style="bottom: 40%; left: -5%; animation-duration: 35s;">𒀝𒅗𒁺𒀝𒅗</div>
    </div>
    <div class="bg-pattern"></div>

    <nav class="sticky top-0 z-50 bg-[var(--bg-primary)]/95 backdrop-blur-lg gold-border-bottom">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center flex-wrap gap-3">
                <div class="flex items-center gap-3">
                    <img id="storeLogo" src="" alt="شعار" class="w-12 h-12 rounded-full border-2 border-[#d4af37] object-cover">
                    <div>
                        <div class="text-2xl font-black text-[#d4af37]">أَكَّد</div>
                        <div class="text-[10px] text-white/40">𒀝𒅗𒁺 𒀭𒈾𒀜𒈾</div>
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
                    <button onclick="shareStore()" class="w-10 h-10 rounded-lg bg-white/10 hover:bg-white/20"><i class="fas fa-share-alt"></i></button>
                </div>
            </div>
            
            <div class="relative mt-4">
                <input type="text" id="searchInput" onkeyup="filterProducts()" class="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 pr-12 text-white placeholder:text-white/30 outline-none focus:border-[#d4af37]" placeholder="🔍 ابحث عن منتج...">
                <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-white/30"></i>
            </div>
            
            <div class="mt-4 overflow-x-auto">
                <div id="categoriesContainer" class="categories-scroll"></div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6">
        <div id="marqueeSection" class="marquee-section" style="display: none;">
            <div class="marquee-track" id="marqueeTrack"></div>
        </div>
        
        <div id="productsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        
        <div id="loadingProducts" class="loading"><div class="loader"></div><p>جاري تحميل المنتجات...</p></div>
    </main>

    <footer class="footer">
        <div class="social-icons" id="socialIcons"></div>
        <div class="text-sm text-gray-500">© 2024 متجر أكَّاد - جميع الحقوق محفوظة</div>
    </footer>

    <div class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-arrow-up"></i></div>

    <!-- مودال المواصفات -->
    <div id="specsModal" class="modal">
        <div class="modal-content">
            <h3 class="text-[#d4af37] text-xl mb-3">📋 المواصفات</h3>
            <div id="specsContent"></div>
            <button onclick="closeModal('specsModal')" class="btn-gold w-full mt-4 py-2">إغلاق</button>
        </div>
    </div>

    <!-- مودال الفيديو -->
    <div id="videoModal" class="modal">
        <div class="video-modal">
            <div class="flex justify-end p-2"><button onclick="closeModal('videoModal')" class="text-white text-2xl hover:text-[#d4af37]">&times;</button></div>
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAEH25yJ-pwfgFUMjLZNgDyNqw8Rcv9S6E",
            authDomain: "akkad-store-ab5a1.firebaseapp.com",
            databaseURL: "https://akkad-store-ab5a1-default-rtdb.firebaseio.com",
            projectId: "akkad-store-ab5a1",
            storageBucket: "akkad-store-ab5a1.firebasestorage.app",
            messagingSenderId: "456810444639",
            appId: "1:456810444639:web:a706dc19781cd7738e28ea"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let categories = [];
        let products = [];
        let settings = {};
        let currentCategory = 'all';
        let searchQuery = '';

        async function loadData() {
            await Promise.all([loadCategories(), loadProducts(), loadSettings()]);
            document.getElementById('loadingProducts').style.display = 'none';
            renderCategories();
            renderProducts();
            renderMarquee();
            renderSocialIcons();
            updateLogo();
        }

        async function loadCategories() {
            const snapshot = await db.ref('categories').once('value');
            const data = snapshot.val();
            categories = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })).sort((a,b) => (a.order || 0) - (b.order || 0)) : [];
        }

        async function loadProducts() {
            const snapshot = await db.ref('products').once('value');
            const data = snapshot.val();
            products = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
        }

        async function loadSettings() {
            const snapshot = await db.ref('settings').once('value');
            settings = snapshot.val() || {};
            const speed = settings.marqueeSpeed || 30;
            document.documentElement.style.setProperty('--marquee-speed', speed + 's');
        }

        function updateLogo() {
            if (settings.storeLogo) {
                document.getElementById('storeLogo').src = settings.storeLogo;
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = `<button class="cat-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="filterByCategory('all')">الكل</button>`;
            categories.forEach(cat => {
                container.innerHTML += `<button class="cat-btn ${currentCategory === cat.id ? 'active' : ''}" onclick="filterByCategory('${cat.id}')">${escapeHtml(cat.name)}</button>`;
            });
        }

        function filterByCategory(categoryId) {
            currentCategory = categoryId;
            renderCategories();
            renderProducts();
        }

        function filterProducts() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            let filtered = products;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.categoryId === currentCategory);
            }
            if (searchQuery) {
                filtered = filtered.filter(p => p.name?.toLowerCase().includes(searchQuery) || p.description?.toLowerCase().includes(searchQuery));
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">لا توجد منتجات</div>';
                return;
            }
            
            container.innerHTML = '';
            filtered.forEach(prod => {
                const catName = categories.find(c => c.id === prod.categoryId)?.name || '';
                const hasVideo = prod.videoCode && prod.videoCode.length > 5;
                container.innerHTML += `
                    <div class="product-card">
                        <div class="media-box" onclick="openVideo('${prod.videoCode || ''}')">
                            <img src="${escapeHtml(prod.image || 'https://placehold.co/400x300')}" alt="${escapeHtml(prod.name)}" onerror="this.src='https://placehold.co/400x300'">
                            ${hasVideo ? '<div class="video-overlay"><i class="fas fa-play-circle"></i></div><div class="video-badge"><i class="fas fa-video"></i> فيديو</div>' : ''}
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-lg">${escapeHtml(prod.name)}</h3>
                            <div class="text-[#d4af37] text-xl font-bold mt-1">$${prod.price || 0}</div>
                            <p class="text-sm text-gray-400 mt-2 line-clamp-2">${escapeHtml(prod.description?.substring(0, 80) || '')}</p>
                            <div class="flex gap-2 mt-4">
                                <button onclick="showSpecs('${prod.id}')" class="flex-1 btn-gold py-2"><i class="fas fa-info-circle"></i> المواصفات</button>
                                <button onclick="orderProduct('${prod.id}')" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-xl transition"><i class="fab fa-whatsapp"></i> طلب</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderMarquee() {
            const topProducts = [...products].sort((a,b) => (b.price || 0) - (a.price || 0)).slice(0, 10);
            if (topProducts.length === 0) return;
            const track = document.getElementById('marqueeTrack');
            const items = [...topProducts, ...topProducts].map(p => `
                <div class="marquee-item" onclick="scrollToProduct('${p.id}')">
                    <img src="${escapeHtml(p.image || 'https://placehold.co/70x70')}" onerror="this.src='https://placehold.co/70x70'">
                    <div>
                        <div class="font-bold">${escapeHtml(p.name)}</div>
                        <div class="text-[#d4af37] text-sm">$${p.price || 0}</div>
                    </div>
                </div>
            `).join('');
            track.innerHTML = items;
            document.getElementById('marqueeSection').style.display = 'block';
        }

        function scrollToProduct(productId) {
            const productCard = document.querySelector(`.product-card:has([onclick="showSpecs('${productId}')"])`);
            if (productCard) {
                productCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                productCard.style.transform = 'scale(1.02)';
                setTimeout(() => { productCard.style.transform = ''; }, 500);
            }
        }

        function showSpecs(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            const specs = product.specs || {};
            const specsHtml = Object.keys(specs).length === 0 ? '<p class="text-gray-400">لا توجد مواصفات مسجلة</p>' :
                Object.entries(specs).map(([key, val]) => `<div class="flex justify-between py-2 border-b border-white/10"><span class="text-[#d4af37]">${escapeHtml(key)}</span><span>${escapeHtml(val)}</span></div>`).join('');
            document.getElementById('specsContent').innerHTML = `
                <h4 class="font-bold mb-2">${escapeHtml(product.name)}</h4>
                <p class="text-sm text-gray-400 mb-3">${escapeHtml(product.description || '')}</p>
                <div class="detail-spec">${specsHtml}</div>
            `;
            document.getElementById('specsModal').style.display = 'flex';
        }

        function openVideo(videoCode) {
            if (!videoCode) return;
            let videoId = videoCode;
            if (videoCode.includes('youtube.com/watch?v=')) {
                videoId = videoCode.split('v=')[1]?.split('&')[0];
            } else if (videoCode.includes('youtu.be/')) {
                videoId = videoCode.split('youtu.be/')[1]?.split('?')[0];
            }
            if (videoId) {
                document.getElementById('videoIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                document.getElementById('videoModal').style.display = 'flex';
            }
        }

        function orderProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            const whatsappNumber = settings.whatsappNumber || '';
            if (!whatsappNumber) {
                alert('الرجاء إضافة رقم الواتساب من لوحة التحكم');
                return;
            }
            const message = `🛍️ طلب منتج من متجر أكاد\n\n📦 المنتج: ${product.name}\n💰 السعر: $${product.price}\n🔗 رابط المنتج: ${window.location.href}`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function renderSocialIcons() {
            const container = document.getElementById('socialIcons');
            const icons = [];
            if (settings.whatsappNumber) icons.push({ icon: 'fab fa-whatsapp', link: `https://wa.me/${settings.whatsappNumber}`, color: '#25D366' });
            if (settings.facebookLink) icons.push({ icon: 'fab fa-facebook', link: settings.facebookLink, color: '#1877F2' });
            if (settings.instagramLink) icons.push({ icon: 'fab fa-instagram', link: settings.instagramLink, color: '#E4405F' });
            if (settings.telegramLink) icons.push({ icon: 'fab fa-telegram', link: settings.telegramLink, color: '#26A5E4' });
            container.innerHTML = icons.map(s => `<a href="${s.link}" target="_blank" style="color:${s.color}"><i class="${s.icon} fa-2x"></i></a>`).join('');
        }

        function shareStore() {
            if (navigator.share) {
                navigator.share({ title: 'متجر أكاد', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط المتجر');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if (modalId === 'videoModal') {
                document.getElementById('videoIframe').src = '';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
        }

        window.onscroll = () => {
            const btn = document.getElementById('scrollTop');
            if (window.scrollY > 300) btn.classList.add('visible');
            else btn.classList.remove('visible');
        };

        loadData();
    </script>
</body>
</html>
